aid: feldera
name: Feldera
description: >-
  Feldera is an incremental compute engine for running complex SQL data pipelines
  in real time. Rather than reprocessing entire datasets, it updates materialized
  views proportionally to the changes in the input data, delivering low-latency,
  low-cost results for use cases such as fraud detection, feature engineering,
  change data capture, and real-time dashboards. Feldera is built on the DBSP
  incremental computation theory and is available as an open-source engine, a
  self-hosted enterprise platform, and a hosted online sandbox (try.feldera.com).
  Developers define pipelines as SQL programs with input/output connectors and
  manage them through the Feldera REST API, a Python client, and the fda CLI.
  Backed by Costanoa Ventures.
