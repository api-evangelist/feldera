          format: int64
          description: 'The number of input records processed by the circuit.


            This metric tracks the end-to-end progress of the pipeline: the output

            of this endpoint is equal to the output of the circuit after

            processing `total_processed_input_records` records.


            In a multihost pipeline, this count reflects only the input records

            processed on the same host as the output endpoint, which is not usually

            meaningful.'
          minimum: 0
        total_processed_steps:
          type: integer
          format: int64
          description: 'The number of steps whose input records have been processed by the

            endpoint.


            This is meaningful in a multihost pipeline because steps are

            synchronized across all of the hosts.


            # Interpretation


            This is a count, not a step number.  If `total_processed_steps` is 0, no

            steps have been processed to completion.  If `total_processed_steps >

            0`, then the last step whose input records have been processed to

            completion is `total_processed_steps - 1`. A record that was ingested in

            step `n` is fully processed when `total_processed_steps > n`.'
          minimum: 0
        transmitted_bytes:
          type: integer
          format: int64
          description: Bytes sent on the underlying transport.
          minimum: 0
        transmitted_records:
          type: integer
          format: int64
          description: Records sent on the underlying transport.
          minimum: 0
    TemporarySuspendError:
      oneOf:
      - type: string
        enum:
        - Replaying
      - type: string
        enum:
        - Bootstrapping
      - type: string
        enum:
        - TransactionInProgress
      - type: object
        required:
        - InputEndpointBarrier
        properties:
          InputEndpointBarrier:
            type: string
      - type: string
        enum:
        - Coordination
      description: Reasons why a pipeline cannot be suspended at this time.
    ConnectorHealthStatus:
      type: string
      enum:
      - Healthy
      - Unhealthy
    PipelineMonitorEventFieldSelector:
      type: string
      enum:
      - all
      - status
    MetricsFormat:
      type: string
      description: 'Circuit metrics output format.

        - `prometheus`: [format](https://github.com/prometheus/docs/blob/4b1b80f5f660a2f8dc25a54f52a65a502f31879a/docs/instrumenting/exposition_formats.md) expected by Prometheus

        - `json`: JSON format'
      enum:
      - prometheus
      - json
    CheckpointActivity:
      oneOf:
      - type: object
        required:
        - status
        properties:
          status:
            type: string
            enum:
            - idle
      - type: object
        description: 'A checkpoint has been requested but is delayed for temporary reasons

          (e.g. replaying, bootstrapping, transaction in progress, or input

          endpoint barriers that require the coordinator to run steps).'
        required:
        - reasons
        - delayed_since
        - status
        properties:
          delayed_since:
            type: string
            format: date-time
            description: When the delay started (serialized as ISO 8601).
          reasons:
            type: array
            items:
              $ref: '#/components/schemas/TemporarySuspendError'
            description: Why the checkpoint cannot proceed yet.
          status:
            type: string
            enum:
            - delayed
      - type: object
        description: A checkpoint is currently being written to storage.
        required:
        - started_at
        - status
        properties:
          started_at:
            type: string
            format: date-time
            description: When the checkpoint write started (serialized as ISO 8601).
          status:
            type: string
            enum:
            - in_progress
      description: Current checkpoint activity state.
      discriminator:
        propertyName: status
