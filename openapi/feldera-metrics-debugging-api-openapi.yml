components:
  schemas:
    StorageStatus:
      type: string
      description: 'Storage status.


        The storage status can only transition when the resources status is `Stopped`.


        ```text

        Cleared ───┐

        ▲       │

        /clear │       │

        │       │

        Clearing   │

        ▲       │

