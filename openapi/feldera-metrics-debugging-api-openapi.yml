          type: string
          format: uuid
          description: Uniquely identifies the pipeline process that started at start_time.
        initial_start_time:
          type: integer
          format: int64
          description: Time at which the pipeline process from which we resumed started, in seconds since the epoch.
          minimum: 0
        memory_pressure:
          $ref: '#/components/schemas/MemoryPressure'
        memory_pressure_epoch:
          type: integer
          format: int64
          description: Memory pressure epoch.
          minimum: 0
        output_stall_msecs:
          type: integer
          format: int64
          description: 'If the pipeline is stalled because one or more output connectors'' output

            buffers are full, this is the number of milliseconds that the current

            stall has lasted.


            If this is nonzero, then the output connectors causing the stall can be

            identified by noticing `ExternalOutputEndpointMetrics::queued_records`

            is greater than or equal to `ConnectorConfig::max_queued_records`.


            In the ordinary case, the pipeline is not stalled, and this value is 0.'
          minimum: 0
        pipeline_complete:
          type: boolean
          description: True if the pipeline has processed all input data to completion.
        rss_bytes:
          type: integer
          format: int64
          description: Resident set size of the pipeline process, in bytes.
          minimum: 0
        runtime_elapsed_msecs:
          type: integer
          format: int64
          description: Time elapsed while the pipeline is executing a step, multiplied by the number of threads, in milliseconds.
          minimum: 0
        start_time:
          type: integer
          format: int64
          description: Time at which the pipeline process started, in seconds since the epoch.
          minimum: 0
        state:
          $ref: '#/components/schemas/PipelineState'
        storage_bytes:
          type: integer
          format: int64
          description: Current storage usage in bytes.
          minimum: 0
        storage_mb_secs:
          type: integer
          format: int64
          description: Storage usage integrated over time, in megabytes * seconds.
          minimum: 0
        total_completed_records:
          type: integer
          format: int64
          description: Total number of input records processed to completion.
          minimum: 0
        total_completed_steps:
          type: integer
          format: int64
          description: 'Number of steps whose input records have been processed to completion.


            A record is processed to completion if it has been processed by the DBSP engine and

            all outputs derived from it have been processed by all output connectors.


            # Interpretation


            This is a count, not a step number.  If `total_completed_steps` is 0, no

            steps have been processed to completion.  If `total_completed_steps >

            0`, then the last step whose input records have been processed to

            completion is `total_completed_steps - 1`. A record that was ingested

            when `total_initiated_steps` was `n` is fully processed when

            `total_completed_steps >= n`.'
          minimum: 0
        total_initiated_steps:
          type: integer
          format: int64
          description: 'Number of steps that have been initiated.


            # Interpretation


            This is a count, not a step number.  If `total_initiated_steps` is 0, no

            steps have been initiated.  If `total_initiated_steps > 0`, then step

            `total_initiated_steps - 1` has been started and all steps previous to

            that have been completely processed by the circuit.'
          minimum: 0
        total_input_bytes:
          type: integer
          format: int64
          description: Total number of bytes received from all endpoints.
          minimum: 0
        total_input_records:
          type: integer
          format: int64
          description: Total number of records received from all endpoints.
          minimum: 0
        total_processed_bytes:
          type: integer
          format: int64
          description: Total bytes of input records processed by the DBSP engine.
          minimum: 0
        total_processed_records:
          type: integer
          format: int64
          description: Total number of input records processed by the DBSP engine.
          minimum: 0
        transaction_id:
          type: integer
          format: int64
          description: ID of the current transaction or 0 if no transaction is in progress.
        transaction_initiators:
          $ref: '#/components/schemas/TransactionInitiators'
        transaction_msecs:
          type: integer
          format: int64
          description: 'Elapsed time in milliseconds, according to `transaction_status`:


            - [TransactionStatus::TransactionInProgress]: Time that this transaction

            has been in progress.


            - [TransactionStatus::CommitInProgress]: Time that this transaction has

            been committing.'
          nullable: true
          minimum: 0
        transaction_records:
          type: integer
          format: int64
          description: 'Number of records in this transaction, according to

            `transaction_status`:


            - [TransactionStatus::TransactionInProgress]: Number of records added so

            far.  More records might be added.


            - [TransactionStatus::CommitInProgress]: Final number of records.'
          nullable: true
          minimum: 0
        transaction_status:
          $ref: '#/components/schemas/TransactionStatus'
        uptime_msecs:
          type: integer
          format: int64
          description: 'Time since the pipeline process started, including time that the

            pipeline was running or paused.


            This is the elapsed time since `start_time`.'
          minimum: 0
    ClockAdvanceRequest:
      type: object
      description: 'Body of `POST /clock/advance`.


        `delta_ms` is unsigned; negative values fail JSON deserialization.

        `Some(0)` reads the current `NOW()` without moving it or rounding

        it; `Some(n)` advances by `n` ms; `None` (`null` or omitted)

        advances by one `clock_resolution`.  Non-zero values round up to

        the next `clock_resolution` boundary, so a sub-resolution delta

        still moves the clock by one full tick.'
      properties:
        delta_ms:
          type: integer
          format: int64
          nullable: true
          minimum: 0
