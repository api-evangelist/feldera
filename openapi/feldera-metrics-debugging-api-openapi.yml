  /v0/pipelines/{pipeline_name}/support_bundle:
    get:
      tags:
      - Metrics & Debugging
      summary: Download Support Bundle
      description: 'Generate a support bundle for a pipeline.


        This endpoint collects various diagnostic data from the pipeline including

        circuit profile, heap profile, metrics, logs, stats, and connector statistics,

        and packages them into a single ZIP file for support purposes.'
      operationId: get_pipeline_support_bundle
      parameters:
      - name: pipeline_name
        in: path
        description: Unique pipeline name
        required: true
        schema:
          type: string
      - name: collect
        in: query
        description: 'Whether to collect new data from the running pipeline (default: true)

          When false, only previously collected data will be included in the bundle'
        required: false
        schema:
          type: boolean
      - name: limit
        in: query
        description: 'Maximum number of collections to include in the bundle, counted from

          the most recent. Must be at least 1; `limit=0` is rejected with HTTP 400.

          Omit the parameter to include every retained collection (which is capped

          server-side by `--support-data-retention`, default 3).


          With the default `collect=true`, `limit=1` returns only the collection

          gathered by this request. Combine with `collect=false` to return the

          most recent previously stored collections instead.'
        required: false
        schema:
          type: integer
          format: int64
          nullable: true
          minimum: 0
      - name: circuit_profile
        in: query
        description: 'Whether to collect circuit profile data (default: true)'
        required: false
        schema:
          type: boolean
      - name: heap_profile
        in: query
        description: 'Whether to collect heap profile data (default: true)'
        required: false
        schema:
          type: boolean
      - name: metrics
        in: query
        description: 'Whether to collect metrics data (default: true)'
        required: false
        schema:
          type: boolean
      - name: logs
        in: query
        description: 'Whether to collect logs data (default: true)'
        required: false
        schema:
          type: boolean
      - name: stats
        in: query
        description: 'Whether to collect stats data (default: true)'
        required: false
        schema:
          type: boolean
      - name: pipeline_config
        in: query
        description: 'Whether to collect pipeline configuration data (default: true)'
        required: false
        schema:
          type: boolean
      - name: system_config
        in: query
        description: 'Whether to collect system configuration data (default: true)'
        required: false
        schema:
          type: boolean
      - name: dataflow_graph
        in: query
        description: 'Whether to collect dataflow graph data (default: true)'
        required: false
        schema:
          type: boolean
      - name: pipeline_events
        in: query
        description: 'Whether to collect the pipeline monitor event history (default: true)'
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Support bundle containing diagnostic information
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '400':
          description: A query parameter was invalid (e.g., `limit=0`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Pipeline with that name does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Unknown pipeline name 'non-existent-pipeline'
