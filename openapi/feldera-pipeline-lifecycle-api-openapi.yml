    DeltaTableReaderConfig:
      type: object
      description: Delta table input connector configuration.
      required:
      - uri
      - mode
      properties:
        cdc_delete_filter:
          type: string
          description: 'A predicate that determines whether the record represents a deletion.


            This setting is only valid in the `cdc` mode. It specifies a predicate applied to

            each row in the Delta table to determine whether the row represents a deletion event.

            Its value must be a valid Boolean SQL expression that can be used in a query of the

            form `SELECT * from <table> WHERE <cdc_delete_filter>`.'
          nullable: true
        cdc_order_by:
          type: string
          description: 'An expression that determines the ordering of updates in the Delta table.


            This setting is only valid in the `cdc` mode. It specifies a predicate applied to

            each row in the Delta table to determine the order in which updates in the table should

            be applied. Its value must be a valid SQL expression that can be used in a query of the

            form `SELECT * from <table> ORDER BY <cdc_order_by>`.'
          nullable: true
        datetime:
          type: string
          description: 'Optional timestamp for the snapshot in the ISO-8601/RFC-3339 format, e.g.,

            "2024-12-09T16:09:53+00:00".


            When this option is set, the connector finds and opens the version of the table as of the

            specified point in time (based on the server time recorded in the transaction log, not the

            event time encoded in the data).  In `snapshot` and `snapshot_and_follow` modes, it

            retrieves the snapshot of this version of the table.  In `follow`, `snapshot_and_follow`, and

            `cdc` modes, it follows transaction log records **after** this version.


            Note: at most one of `version` and `datetime` options can be specified.

            When neither of the two options is specified, the latest committed version of the table

            is used.'
          nullable: true
        end_version:
          type: integer
          format: int64
          description: 'Optional final table version.


            Valid only when the connector is configured in `follow`, `snapshot_and_follow`, or `cdc` mode.


            When set, the connector will stop scanning the table’s transaction log after reaching this version or any greater version.

            This bound is inclusive: if the specified version appears in the log, it will be processed before signaling end-of-input.'
          nullable: true
        filter:
          type: string
          description: 'Optional row filter.


            When specified, only rows that satisfy the filter condition are read from the delta table.

            The condition must be a valid SQL Boolean expression that can be used in

            the `where` clause of the `select * from my_table where ...` query.'
          nullable: true
        max_concurrent_readers:
          type: integer
          format: int32
          description: 'Maximum number of concurrent object store reads performed by all Delta Lake connectors.


            This setting is used to limit the number of concurrent reads of the object store in a

            pipeline with a large number of Delta Lake connectors. When multiple connectors are simultaneously

            reading from the object store, this can lead to transport timeouts.


            When enabled, this setting limits the number of concurrent reads across all connectors.

            This is a global setting that affects all Delta Lake connectors, and not just the connector

            where it is specified. It should therefore be used at most once in a pipeline.  If multiple

            connectors specify this setting, they must all use the same value.


            The default value is 6.'
          nullable: true
          minimum: 0
        max_retries:
          type: integer
          format: int32
          description: 'Maximum number of retries for failed object store operations.


            Controls how many times the connector retries high-level storage operations,

            such as reading a Delta log entry or a Parquet file.


            This is in addition to lower-level retries (e.g., individual S3 operation retries governed

            by storage options like `retry_timeout`). If those retries are exhausted

            or the failure is otherwise unrecoverable at the storage layer, the

            connector retries the entire operation.


            Defaults to unlimited retries. Set to 0 to disable retries.'
          nullable: true
          minimum: 0
        mode:
          $ref: '#/components/schemas/DeltaTableIngestMode'
        num_parsers:
          type: integer
          format: int32
          description: 'The number of parallel parsing tasks the connector uses to process data read from the

            table. Increasing this value can enhance performance by allowing more concurrent processing.

            Recommended range: 1–10. The default is 4.'
          minimum: 0
        skip_unused_columns:
          type: boolean
          description: 'Don''t read unused columns from the Delta table.


            When set to `true`, this option instructs the connector to avoid reading

            columns from the Delta table that are not used in any view definitions.

            To be skipped, the columns must be either nullable or have default

            values. This can improve ingestion performance, especially for wide

            tables.


            Note: The simplest way to exclude unused columns is to omit them from the Feldera SQL table

            declaration. The connector never reads columns that aren''t declared in the SQL schema.

            Additionally, the SQL compiler emits warnings for declared but unused columns—use these as

            a guide to optimize your schema.'
        snapshot_filter:
          type: string
          description: 'Optional snapshot filter.


            This option is only valid when `mode` is set to `snapshot` or `snapshot_and_follow`.


            When specified, only rows that satisfy the filter condition are included in the

            snapshot.  The condition must be a valid SQL Boolean expression that can be used in

            the `where` clause of the `select * from snapshot where ...` query.


            Unlike the `filter` option, which applies to all records retrieved from the table, this

            filter only applies to rows in the initial snapshot of the table.

            For instance, it can be used to specify the range of event times to include in the snapshot,

            e.g.: `ts BETWEEN TIMESTAMP ''2005-01-01 00:00:00'' AND TIMESTAMP ''2010-12-31 23:59:59''`.


            This option can be used together with the `filter` option. During the initial snapshot,

            only rows that satisfy both `filter` and `snapshot_filter` are retrieved from the Delta table.

            When subsequently following changes in the the transaction log (`mode = snapshot_and_follow`),

            all rows that meet the `filter` condition are ingested, regardless of `snapshot_filter`.'
          nullable: true
        timestamp_column:
          type: string
          description: 'Table column that serves as an event timestamp.


            When this option is specified, and `mode` is one of `snapshot` or `snapshot_and_follow`,

            table rows are ingested in the timestamp order, respecting the

            [`LATENESS`](https://docs.feldera.com/sql/streaming#lateness-expressions)

            property of the column: each ingested row has a timestamp no more than `LATENESS`

            time units earlier than the most recent timestamp of any previously ingested row.

            The ingestion is performed by partitioning the table into timestamp ranges of width

            `LATENESS`. Each range is processed sequentially, in increasing timestamp order.


            # Example


            Consider a table with timestamp column of type `TIMESTAMP` and lateness attribute

            `INTERVAL 1 DAY`. Assuming that the oldest timestamp in the table is

            `2024-01-01T00:00:00``, the connector will fetch all records with timestamps

            from `2024-01-01`, then all records for `2024-01-02`, `2024-01-03`, etc., until all records

            in the table have been ingested.


            # Requirements


            * The timestamp column must be of a supported type: integer, `DATE`, or `TIMESTAMP`.

            * The timestamp column must be declared with non-zero `LATENESS`.

            * For efficient ingest, the table must be optimized for timestamp-based

            queries using partitioning, Z-ordering, or liquid clustering.'
          nullable: true
        transaction_mode:
          $ref: '#/components/schemas/DeltaTableTransactionMode'
        uri:
          type: string
          description: 'Table URI.


            Example: "s3://feldera-fraud-detection-data/demographics_train"'
        verbose:
          type: integer
          format: int32
          description: 'Enable verbose logging.


            When enabled, the connector will log detailed information at INFO level.


            Supported values:

            * 0 - no verbose logging

            * 1 - log all Delta log entries in follow and cdc modes.

            * >1 - reserved for future use'
          minimum: 0
        version:
          type: integer
          format: int64
          description: 'Optional table version.


            When this option is set, the connector finds and opens the specified version of the table.

            In `snapshot` and `snapshot_and_follow` modes, it retrieves the snapshot of this version of

            the table.  In `follow`, `snapshot_and_follow`, and `cdc` modes, it follows transaction log records

            **after** this version.


            Note: at most one of `version` and `datetime` options can be specified.

            When neither of the two options is specified, the latest committed version of the table

            is used.'
          nullable: true
      additionalProperties:
        type: string
        description: 'Storage options for configuring backend object store.


          For specific options available for different storage backends, see:

          * [Azure options](https://docs.rs/object_store/latest/object_store/azure/enum.AzureConfigKey.html)

          * [Amazon S3 options](https://docs.rs/object_store/latest/object_store/aws/enum.AmazonS3ConfigKey.html)

          * [Google Cloud Storage options](https://docs.rs/object_store/latest/object_store/gcp/enum.GoogleConfigKey.html)'
    RestCatalogConfig:
      type: object
      description: Iceberg REST catalog config.
      properties:
        rest.audience:
          type: string
          description: Logical name of target resource or service.
          nullable: true
        rest.credential:
          type: string
          description: 'Credential to use for OAuth2 credential flow when initializing the catalog.


            A key and secret pair separated by ":" (key is optional).'
          nullable: true
        rest.headers:
          type: array
          items:
            type: array
            items:
              allOf:
              - type: string
              - type: string
          description: Additional HTTP request headers added to each catalog REST API call.
          nullable: true
        rest.oauth2-server-uri:
          type: string
          description: 'Authentication URL to use for client credentials authentication (default: uri + ''v1/oauth/tokens'')'
          nullable: true
        rest.prefix:
          type: string
          description: 'Customize table storage paths.


            When combined with the `warehouse` property, the prefix determines

            how table data is organized within the storage.'
          nullable: true
        rest.resource:
          type: string
          description: URI for the target resource or service.
          nullable: true
        rest.scope:
          type: string
          nullable: true
        rest.token:
          type: string
          description: Bearer token value to use for `Authorization` header.
          nullable: true
        rest.uri:
          type: string
          description: URI identifying the REST catalog server.
          nullable: true
        rest.warehouse:
          type: string
          description: The default location for managed tables created by the catalog.
          nullable: true
    StorageBackendConfig:
      oneOf:
      - type: object
        required:
        - name
        properties:
          name:
            type: string
            enum:
            - default
      - type: object
        required:
        - name
        - config
        properties:
          config:
            $ref: '#/components/schemas/FileBackendConfig'
          name:
            type: string
            enum:
            - file
      - type: object
        required:
        - name
        - config
        properties:
          config:
            $ref: '#/components/schemas/ObjectStorageConfig'
          name:
            type: string
            enum:
            - object
      description: Backend storage configuration.
      discriminator:
        propertyName: name
    RemoteCheckpoint:
      type: object
      description: A checkpoint that exists in remote object storage.
      required:
      - uuid
      properties:
        uuid:
          type: string
          format: uuid
          description: UUID of the checkpoint.
    DynamoDBWriterConfig:
      type: object
      description: DynamoDB output connector configuration.
      required:
      - table
      - region
      properties:
        aws_access_key_id:
          type: string
          description: 'AWS access key ID.


            If both `aws_access_key_id` and `aws_secret_access_key` are specified,

            the connector uses these static credentials. Otherwise it uses the

            default AWS credential provider chain, including IAM Roles for Service

            Accounts (IRSA) in EKS.


            Static credentials are treated as long-lived IAM keys: no session token

            is sent, so STS-issued temporary credentials are not supported via these

            fields. To use temporary credentials, rely on the default provider chain

            instead (leave these unset).'
          nullable: true
        aws_secret_access_key:
          type: string
          description: AWS secret access key.
          nullable: true
        batch_size:
          type: integer
          description: 'Maximum number of write requests in one DynamoDB write call.


            DynamoDB supports at most 100 for `TransactWriteItems` and at most 25

            for `BatchWriteItem`. If omitted, the connector uses the maximum for

            the selected `write_mode`.'
          nullable: true
          minimum: 0
        delete_condition_expression:
          type: string
          description: '[Condition expression] evaluated before each delete.


            When the condition is false, the delete is skipped without failing the

            connector. This option requires `transactional` [`write_mode`]. The

            expression cannot use `ExpressionAttributeNames` or

            `ExpressionAttributeValues` placeholders.


            [Condition expression]: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Expressions.ConditionExpressions.html

            [`write_mode`]: Self::write_mode'
          nullable: true
        endpoint_url:
          type: string
          description: 'Optional endpoint URL, for example when using a local

            DynamoDB-compatible service.'
          nullable: true
        max_buffer_size_bytes:
          type: integer
          description: 'Maximum number of bytes buffered by each worker before flushing writes.


            This is an approximate size based on encoded DynamoDB attributes.'
          default: 1048576
          minimum: 0
        max_concurrent_requests:
          type: integer
          description: 'Maximum number of DynamoDB write requests in flight per worker thread.


            The total in-flight request count across the connector is

            `threads × max_concurrent_requests`. Size this accordingly when

            tuning against a provisioned-throughput table to avoid excessive

            throttling.'
          default: 64
          minimum: 0
        max_retries:
          type: integer
          format: int32
          description: 'Maximum number of retries for a failed or partially-applied DynamoDB write chunk.


            For `batch` writes, `BatchWriteItem` may return some items as "unprocessed" in a

            successful 200 response; those are re-submitted and counted as retries. For

            `transactional` writes, a failed `TransactWriteItems` call is retried in full.


            Transient errors (throttling, network failures) are first handled transparently by the

            AWS SDK. Only attempts that reach this connector''s retry loop count against this limit.

            Each retry waits longer than the previous one (exponential backoff), up to a ceiling

            of roughly 13 seconds.


            Set to `null` to retry indefinitely. After the backoff ceiling is reached the connector

            keeps retrying at that interval, providing backpressure until DynamoDB recovers.

            Defaults to `10`.'
          default: 10
          nullable: true
          minimum: 0
        put_condition_expression:
          type: string
          description: '[Condition expression] evaluated before each put (insert or upsert).


            When the condition is false, the record is skipped without failing the

            connector. This option requires `transactional` [`write_mode`].


            The condition gates every value write, and the connector cannot tell a

            replayed insert from a legitimate update: both arrive as puts. A guard

            such as `attribute_not_exists(id)` therefore also suppresses updates to

            existing keys, not just replayed duplicates. Choose the expression

            accordingly.


            The connector does not currently support `ExpressionAttributeNames` or

            `ExpressionAttributeValues`, so the expression cannot use placeholders.


            [Condition expression]: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Expressions.ConditionExpressions.html

            [`write_mode`]: Self::write_mode'
          nullable: true
        region:
          type: string
          description: AWS region.
        table:
          type: string
          description: Name of the DynamoDB table to write to.
        threads:
          type: integer
          description: Number of worker threads used to encode and write disjoint key ranges.
          default: 1
          minimum: 0
        write_mode:
          allOf:
          - $ref: '#/components/schemas/DynamoDBWriteMode'
          default: batch
    ErrorResponse:
      type: object
      description: Information returned by REST API endpoints on error.
      required:
      - message
      - error_code
      - details
      properties:
        details:
          description: 'Detailed error metadata.

            The contents of this field is determined by `error_code`.'
        error_code:
          type: string
          description: Error code is a string that specifies this error type.
          example: CodeSpecifyingErrorType
        message:
          type: string
          description: Human-readable error message.
          example: Explanation of the error that occurred.
    IcebergReaderConfig:
      allOf:
      - $ref: '#/components/schemas/GlueCatalogConfig'
      - $ref: '#/components/schemas/RestCatalogConfig'
      - $ref: '#/components/schemas/S3TablesCatalogConfig'
      - type: object
        required:
        - mode
        properties:
          catalog_type:
            allOf:
            - $ref: '#/components/schemas/IcebergCatalogType'
            nullable: true
          datetime:
            type: string
            description: 'Optional timestamp for the snapshot in the ISO-8601/RFC-3339 format, e.g.,

              "2024-12-09T16:09:53+00:00".


              When this option is set, the connector finds and opens the snapshot of the table as of the

              specified point in time (based on the server time recorded in the transaction

              log, not the event time encoded in the data).  In `snapshot` and `snapshot_and_follow`

              modes, it retrieves this snapshot.  In `follow` and `snapshot_and_follow` modes, it

              follows transaction log records **after** this snapshot.


              Note: at most one of `snapshot_id` and `datetime` options can be specified.

              When neither of the two options is specified, the latest committed version of the table

              is used.'
            nullable: true
          metadata_location:
            type: string
            description: 'Location of the table metadata JSON file.


              This propery is used to access an Iceberg table without a catalog. It is mutually

              exclusive with the `catalog_type` property.'
            nullable: true
          mode:
            $ref: '#/components/schemas/IcebergIngestMode'
          snapshot_filter:
            type: string
            description: 'Optional row filter.


              This option is only valid when `mode` is set to `snapshot` or `snapshot_and_follow`.


              When specified, only rows that satisfy the filter condition are included in the

              snapshot.  The condition must be a valid SQL Boolean expression that can be used in

              the `where` clause of the `select * from snapshot where ...` query.


              This option can be used to specify the range of event times to include in the snapshot,

              e.g.: `ts BETWEEN ''2005-01-01 00:00:00'' AND ''2010-12-31 23:59:59''`.'
            nullable: true
          snapshot_id:
            type: integer
            format: int64
            description: 'Optional snapshot id.


              When this option is set, the connector finds the specified snapshot of the table.

              In `snapshot` and `snapshot_and_follow` modes, it loads this snapshot.

              In `follow` and `snapshot_and_follow` modes, it follows table updates

              **after** this snapshot.


              Note: at most one of `snapshot_id` and `datetime` options can be specified.

              When neither of the two options is specified, the latest committed version of the table

              is used.'
            nullable: true
          table_name:
            type: string
            description: 'Specifies the Iceberg table name in the "namespace.table" format.


              This option is applicable when an Iceberg catalog is configured using the `catalog_type` property.'
            nullable: true
          timestamp_column:
            type: string
            description: 'Table column that serves as an event timestamp.


              When this option is specified, and `mode` is one of `snapshot` or `snapshot_and_follow`,

              table rows are ingested in the timestamp order, respecting the

              [`LATENESS`](https://docs.feldera.com/sql/streaming#lateness-expressions)

              property of the column: each ingested row has a timestamp no more than `LATENESS`

              time units earlier than the most recent timestamp of any previously ingested row.

              The ingestion is performed by partitioning the table into timestamp ranges of width

              `LATENESS`. Each range is processed sequentially, in increasing timestamp order.


              # Example


              Consider a table with timestamp column of type `TIMESTAMP` and lateness attribute

              `INTERVAL 1 DAY`. Assuming that the oldest timestamp in the table is

              `2024-01-01T00:00:00``, the connector will fetch all records with timestamps

              from `2024-01-01`, then all records for `2024-01-02`, `2024-01-03`, etc., until all records

              in the table have been ingested.


              # Requirements


              * The timestamp column must be of a supported type: integer, `DATE`, or `TIMESTAMP`.

              * The timestamp column must be declared with non-zero `LATENESS`.

              * For efficient ingest, the table must be optimized for timestamp-based

              queries using partitioning, Z-ordering, or liquid clustering.'
            nullable: true
        additionalProperties:
          type: string
          description: 'Storage options for configuring backend object store.


            See the [list of available options in PyIceberg documentation](https://py.iceberg.apache.org/configuration/#fileio).'
      description: Iceberg input connector configuration.
    PipelineTemplateConfig:
      type: object
      description: 'Configuration for supplying a custom pipeline StatefulSet template via a Kubernetes ConfigMap.


        Operators can provide a custom StatefulSet YAML that the Kubernetes runner will use when

        creating pipeline StatefulSets for a pipeline. The custom template must be stored as the

        value of a key in a ConfigMap in the same namespace as the pipeline; set `name` to the

        ConfigMap name and `key` to the entry that contains the template.


        Recommendations and requirements:

        - **Start from the default template and modify it as needed.** The default template is present

        in ConfigMap named as `<release-name>-pipeline-template`, with key `pipelineTemplate` in the release

        namespace and should be used as a reference.

        - The template must contain a valid Kubernetes `StatefulSet` manifest in YAML form. The

        runner substitutes variables in the template before parsing; therefore the final YAML

        must be syntactically valid.

        - The runner performs simple string substitution for the following placeholders. Please ensure these

        placeholders are placed at appropriate location for their semantics:

        - `{id}`: pipeline Kubernetes name (used for object names and labels)

        - `{namespace}`: Kubernetes namespace where the pipeline runs

        - `{pipeline_executor_image}`: container image used to run the pipeline executor

        - `{binary_ref}`: program binary reference passed as an argument

        - `{program_info_ref}`: program info reference passed as an argument

        - `{pipeline_storage_path}`: mount path for persistent pipeline storage

        - `{storage_class_name}`: storage class name to use for PVCs (if applicable)

        - `{deployment_id}`: UUID identifying the deployment instance

        - `{deployment_initial}`: initial desired runtime status (e.g., `provisioning`)

        - `{bootstrap_policy}`: bootstrap policy value when applicable'
      required:
      - name
      properties:
        key:
          type: string
          description: 'Key in the ConfigMap containing the pipeline template.


            If not set, defaults to `pipelineTemplate`.'
          default: pipelineTemplate
        name:
          type: string
          description: Name of the ConfigMap containing the pipeline template.
    ReplayPolicy:
      type: string
      enum:
      - Instant
      - Original
    OutputBufferConfig:
      type: object
      properties:
        enable_output_buffer:
          type: boolean
          description: 'Enable output buffering.


            The output buffering mechanism allows decoupling the rate at which the pipeline

            pushes changes to the output transport from the rate of input changes.


            By default, output updates produced by the pipeline are pushed directly to

            the output transport. Some destinations may prefer to receive updates in fewer

            bigger batches. For instance, when writing Parquet files, producing

            one bigger file every few minutes is usually better than creating

            small files every few milliseconds.


            To achieve such input/output decoupling, users can enable output buffering by

            setting the `enable_output_buffer` flag to `true`.  When buffering is enabled, output

            updates produced by the pipeline are consolidated in an internal buffer and are

            pushed to the output transport when one of several conditions is satisfied:


            * data has been accumulated in the buffer for more than `max_output_buffer_time_millis`

            milliseconds.

            * buffer size exceeds `max_output_buffer_size_records` records.


            This flag is `false` by default.'
          default: false
        max_output_buffer_size_records:
          type: integer
          description: 'Maximum number of updates to be kept in the output buffer.


            This parameter bounds the maximal size of the buffer.

            Note that the size of the buffer is not always equal to the

            total number of updates output by the pipeline. Updates to the

            same record can overwrite or cancel previous updates.


            The default is 10,000,000.


            NOTE: this configuration option requires the `enable_output_buffer` flag

            to be set.'
          default: 10000000
          minimum: 0
        max_output_buffer_time_millis:
          type: integer
          description: 'Maximum time in milliseconds data is kept in the output buffer.


            By default, data is kept in the buffer indefinitely until one of

            the other output conditions is satisfied.  When this option is

            set the buffer will be flushed at most every

            `max_output_buffer_time_millis` milliseconds.


            NOTE: this configuration option requires the `enable_output_buffer` flag

            to be set.'
          default: 18446744073709551615
          minimum: 0
    Field:
      allOf:
      - $ref: '#/components/schemas/SqlIdentifier'
      - type: object
        required:
        - columntype
        - unused
        properties:
          columntype:
            $ref: '#/components/schemas/ColumnType'
          default:
            type: string
            nullable: true
          lateness:
            type: string
            nullable: true
          unused:
            type: boolean
          watermark:
            type: string
            nullable: true
      description: 'A SQL field.


        Matches the SQL compiler JSON format.'
    DevTweaks:
      type: object
      description: 'Optional settings for tweaking Feldera internals.


        These settings reflect experiments that may come and go and change from

        version to version.  Users should not consider them to be stable.'
      properties:
        adaptive_joins:
          type: boolean
          description: 'Enable adaptive joins.


            Adaptive joins dynamically change their partitioning policy to avoid skew.


            Adaptive joins are disabled by default.'
          default: null
          nullable: true
        balancer_balance_tax:
          type: number
          format: double
          description: 'Factor that discourages the use of the Balance policy in a perfectly balanced collection.


            Assuming a perfectly balanced key distribution, the Balance policy is slightly less efficient than Shard,

            since it requires computing the hash of the entire key/value pair. This factor discourages the use of this policy

            if the skew is `<balancer_balance_tax`.


            The default value is 1.1.'
          default: null
          nullable: true
        balancer_key_distribution_refresh_threshold:
          type: number
          format: double
          description: 'The balancer threshold for checking for an improved partitioning policy for a stream.


            Finding a good partitioning policy for a circuit involves solving an optimization problem,

            which can be relatively expensive. Instead of doing this on every step, the balancer only

            checks for an improved partitioning policy if the key distribution of a stream has changed

            significantly since the current solution was computed.  Specifically, it only kicks in when

            the size of at least one shard of at least one stream in the cluster has changed by more than

            this threshold.


            The default value is 0.1.'
          default: null
          nullable: true
        balancer_min_absolute_improvement_threshold:
          type: integer
          format: int64
          description: 'The minimum absolute improvement threshold for the balancer.


            The join balancer is a component that dynamically chooses an optimal

            partitioning policy for adaptive join operators.  This parameter

            prevents the join balancer from making changes to the partitioning

            policy if the improvement is not significant, since the overhead of such

            rebalancing, especially when performed frequently, can exceed the

            benefits.


            A rebalancing is considered significant if the absolute estimated

            improvement for the cluster of joins where the rebalancing is applied is

            at least this threshold. The cost model used by the balancer is based on

            the number of records in the largest partition of a collection.


            A rebalancing is applied if both this threshold and

            `balancer_min_relative_improvement_threshold` are met.


            The default value is 10,000.'
          default: null
          nullable: true
          minimum: 0
        balancer_min_relative_improvement_threshold:
          type: number
          format: double
          description: 'The minimum relative improvement threshold for the join balancer.


            The join balancer is a component that dynamically chooses an optimal

            partitioning policy for adaptive join operators.  This parameter

            prevents the join balancer from making changes to the partitioning

            policy if the improvement is not significant, since the overhead of such

            rebalancing, especially when performed frequently, can exceed the

            benefits.


            A rebalancing is considered significant if the relative estimated

            improvement for the cluster of joins where the rebalancing is applied is

            at least this threshold.


            A rebalancing is applied if both this threshold and

            `balancer_min_absolute_improvement_threshold` are met.


            The default value is 1.2.'
          default: null
          nullable: true
        bloom_false_positive_rate:
          type: number
          format: double
          description: 'False-positive rate for Bloom filters on batches on storage, as a

            fraction f, where 0 < f < 1.


            The false-positive rate trades off between the amount of memory used by

            Bloom filters and how frequently storage needs to be searched for keys

            that are not actually present.  Typical false-positive rates and their

            corresponding memory costs are:


            - 0.1: 4.8 bits per key

            - 0.01: 9.6 bits per key

            - 0.001: 14.4 bits per key

            - 0.0001: 19.2 bits per key (default)


            Values outside the valid range, such as 0.0, disable Bloom filters.'
          default: null
          nullable: true
        buffer_cache_allocation_strategy:
          allOf:
          - $ref: '#/components/schemas/BufferCacheAllocationStrategy'
          default: null
          nullable: true
        buffer_cache_strategy:
          allOf:
          - $ref: '#/components/schemas/BufferCacheStrategy'
          default: null
          nullable: true
        buffer_max_buckets:
          type: integer
          description: 'Override the number of buckets/shards used by sharded buffer caches.


            This only applies when `buffer_cache_strategy = "s3_fifo"`. Values are

            rounded up to the next power of two because the current implementation

            shards by `hash(key) & (n - 1)`.'
          default: null
          nullable: true
          minimum: 0
        disable_auto_transaction:
          type: boolean
          description: Don't automatically start a transaction for every step.
          default: null
          nullable: true
        eager_evict:
          type: boolean
          description: 'Evict eagerly from buffer caches as files get deleted.


            This is an optimization that drops files from

            the cache as soon as they are deleted.


            It has unknown (no?) performance benefits from what I can tell.


            Historically it made sense to do this for two reasons:

            a) we know with 100% guarantee that the file won''t ever be

            read again.

            b) we could do this in O(logn) time with the LRU cache.

            This is no longer true for s3-fifo where it is O(n).


            If the eviction is expensive, (many small objects in the cache)

            this can cause a regression.


            New default disables this behavior by making it false.


            If this doesn''t cause regression we will remove this option

            in the future.'
          default: null
          nullable: true
        enable_roaring:
          type: boolean
          description: 'Whether file-backed batches may use roaring membership filters when the

            key type supports them.'
          default: null
          nullable: true
        fbuf_slab_bytes_per_class:
          type: integer
          description: 'Target number of cached bytes retained in each `FBuf` slab size class.


            The default is 16 MiB.'
          default: null
          nullable: true
          minimum: 0
        fetch_distinct:
          type: boolean
          description: 'Whether to asynchronously fetch keys needed for the distinct operator

            from storage.  Asynchronous fetching should be faster for high-latency

            storage, such as object storage, but it could use excessive amounts of

            memory if the number of keys fetched is very large.'
          default: null
          nullable: true
        fetch_join:
          type: boolean
          description: 'Whether to asynchronously fetch keys needed for the join operator from

            storage.  Asynchronous fetching should be faster for high-latency

            storage, such as object storage, but it could use excessive amounts of

            memory if the number of keys fetched is very large.'
          default: null
          nullable: true
        max_level0_batch_size_records:
          type: integer
          format: int32
          description: Maximum batch size in records for level 0 merges.
          default: null
          nullable: true
          minimum: 0
        merger:
          allOf:
          - $ref: '#/components/schemas/MergerType'
          default: null
          nullable: true
        merger_threads:
          type: integer
          format: int32
          description: 'The number of merger threads.


            The default value is equal to the number of worker threads.'
          default: null
          nullable: true
          minimum: 0
        negative_weight_multiplier:
          type: integer
          format: int32
          description: 'Additional bias the merger assigns to records with negative weights

            (retractions) to promote them to higher levels of the LSM tree sooner.


            Reasonable values for this parameter are in the range [0, 10].


            The default value is 0, which means that retractions are not given

            any additional bias.'
          default: null
          nullable: true
          minimum: 0
        now_http_driven:
          type: boolean
          description: 'Drive `NOW()` from an external HTTP endpoint instead of wall clock.


            When `true`, the clock connector emits one initial tick (using

            `now_offset` if set, otherwise wall clock) and then holds that

            value.  Subsequent calls to `POST /clock/advance` move `NOW()`

            forward by the requested delta.  Negative deltas are rejected;

            the clock is forward-only.'
          default: null
          nullable: true
        now_offset:
          type: string
          format: date-time
          description: 'Override the timestamp returned by SQL `NOW()` at pipeline start.


            When set, the clock connector anchors `NOW()` to this RFC 3339

            timestamp the first time the pipeline starts and advances at

            wall-clock cadence from there:

            `NOW() = now_offset + (wall_clock - wall_clock_at_start)`.


            Any RFC 3339 timestamp parseable by `chrono::DateTime<Utc>` is

            accepted (years `0001` through `9999`), in the past or future

            relative to wall clock.


            This is a testing knob for queries that depend on `NOW()`.


            On resume the clock continues from the last journaled `NOW()`;

            `now_offset`''s value is honored only on a fresh start:


            | Initial run | Resume from checkpoint | Post-replay `NOW()` |

            |---|---|---|

            | no offset | no offset | wall clock (unchanged) |

            | offset    | offset    | wall-clock pace from the last journaled value; the new offset value is ignored |

            | offset    | no offset | jumps to wall clock (explicit opt-out of the anchor) |

            | no offset | offset    | wall-clock pace from the last journaled value; the new offset value is ignored |'
          default: null
          nullable: true
        optimize_input_during_commit:
          type: boolean
          description: Optimize input operators during transaction commit.
          default: null
          nullable: true
        splitter_chunk_size_records:
          type: integer
          format: int64
          description: 'Controls the maximal number of records output by splitter operators

            (joins, distinct, aggregation, rolling window and group operators) at

            each step.


            The default value is 10,000 records.'
          default: null
          nullable: true
          minimum: 0
        stack_overflow_backtrace:
          type: boolean
          description: 'Attempt to print a stack trace on stack overflow.


            To be used for debugging only; do not enable in production.'
          default: null
          nullable: true
        storage_mb_max:
          type: integer
          format: int64
          description: 'If set, the maximum amount of storage, in MiB, for the POSIX backend to

            allow to be in use before failing all writes with `StorageFull`.  This

            is useful for testing on top of storage that does not implement its own

            quota mechanism.'
          default: null
          nullable: true
          minimum: 0
        streaming_exchange:
          type: boolean
          description: Enable streaming exchange.
          default: null
          nullable: true
      additionalProperties:
        description: 'Options not understood by this particular version.


          This allows the pipeline manager to take options that a custom or old

          runtime version accepts.'
        default: {}
    HttpOutputConfig:
      type: object
      description: 'Configuration for data output via HTTP.


        HTTP output adapters cannot be usefully configured as part of pipeline

        configuration.  Instead, instantiate them through the REST API as

        `/pipelines/{pipeline_name}/egress`.'
      properties:
        backpressure:
          type: boolean
          description: 'Apply backpressure on the pipeline when the HTTP client cannot receive

            data fast enough.


            When this flag is set to false (the default), the HTTP connector drops data

            chunks if the client is not keeping up with its output.  This prevents

            a slow HTTP client from slowing down the entire pipeline.


            When the flag is set to true, the connector waits for the client to receive

            each chunk and blocks the pipeline if the client cannot keep up.'
          default: false
    RngFieldSettings:
      type: object
      description: Configuration for generating random data for a field of a table.
      properties:
        e:
          type: integer
          format: int64
          description: 'The frequency rank exponent for the Zipf distribution.


            - This value is only used if the strategy is set to `Zipf`.

            - The default value is 1.0.'
          default: 1
        fields:
          type: object
          description: Specifies the values that the generator should produce in case the field is a struct type.
          default: null
          additionalProperties:
            $ref: '#/components/schemas/RngFieldSettings'
          nullable: true
        key:
          allOf:
          - $ref: '#/components/schemas/RngFieldSettings'
          default: null
          nullable: true
        null_percentage:
          type: integer
          description: 'Percentage of records where this field should be set to NULL.


            If not set, the generator will produce only records with non-NULL values.

            If set to `1..=100`, the generator will produce records with NULL values with the specified percentage.'
          default: null
          nullable: true
          minimum: 0
        range:
          type: object
          description: 'An optional, exclusive range [a, b) to limit the range of values the generator should produce.


            - For integer/floating point types specifies min/max values as an integer.

            If not set, the generator will produce values for the entire range of the type for number types.

            - For string/binary types specifies min/max length as an integer, values are required to be >=0.

            If not set, a range of [0, 25) is used by default.

            - For timestamp types specifies the min/max as two strings in the RFC 3339 format

            (e.g., ["2021-01-01T00:00:00Z", "2022-01-02T00:00:00Z"]).

            Alternatively, the range values can be specified as a number of non-leap

            milliseconds since January 1, 1970 0:00:00.000 UTC (aka “UNIX timestamp”).

            If not set, a range of ["1970-01-01T00:00:00Z", "2100-01-01T00:00:00Z") or [0, 4102444800000)

            is used by default.

            - For time types specifies the min/max as two strings in the "HH:MM:SS" format.

            Alternatively, the range values can be specified in milliseconds as two positive integers.

            If not set, the range is 24h.

            - For date types, the min/max range is specified as two strings in the "YYYY-MM-DD" format.

            Alternatively, two integers that represent number of days since January 1, 1970 can be used.

            If not set, a range of ["1970-01-01", "2100-01-01") or [0, 54787) is used by default.

            - For array types specifies the min/max number of elements as an integer.

            If not set, a range of [0, 5) is used by default. Range values are required to be >=0.

            - For map types specifies the min/max number of key-value pairs as an integer.

            If not set, a range of [0, 5) is used by default.

            - For struct/boolean/null types `range` is ignored.'
        scale:
          type: integer
          format: int64
          description: 'A scale factor to apply a multiplier to the generated value.


            - For integer/floating point types, the value is multiplied by the scale factor.

            - For timestamp types, the generated value (milliseconds) is multiplied by the scale factor.

            - For time types, the generated value (milliseconds) is multiplied by the scale factor.

            - For date types, the generated value (days) is multiplied by the scale factor.

            - For string/binary/array/map/struct/boolean/null types, the scale factor is ignored.


            - If `values` is specified, the scale factor is ignored.

            - If `range` is specified and the range is required to be positive (struct, map, array etc.)

            the scale factor is required to be positive too.


            The default scale factor is 1.'
          default: 1
        strategy:
          allOf:
          - $ref: '#/components/schemas/DatagenStrategy'
          default: increment
        value:
          allOf:
          - $ref: '#/components/schemas/RngFieldSettings'
          default: null
          nullable: true
        values:
          type: array
          items:
            type: object
          description: 'An optional set of values the generator will pick from.


            If set, the generator will pick values from the specified set.

            If not set, the generator will produce values according to the specified range.

            If set to an empty set, the generator will produce NULL values.

            If set to a single value, the generator will produce only that value.


            Note that `range` is ignored if `values` is set.'
          default: null
          nullable: true
      additionalProperties: false
    CompilationProfile:
      type: string
      description: 'Enumeration of possible compilation profiles that can be passed to the Rust compiler

        as an argument via `cargo build --profile <>`. A compilation profile affects among

        other things the compilation speed (how long till the program is ready to be run)

        and runtime speed (the performance while running).'
      enum:
      - dev
      - unoptimized
      - optimized
      - optimized_symbols
    ConnectorStats:
      type: object
      description: Statistics across all connectors.
      required:
      - num_errors
      properties:
        num_errors:
          type: integer
          format: int64
          description: 'Total number of errors across all connectors.


            - `num_transport_errors` from all input connectors

            - `num_parse_errors` from all input connectors

            - `num_encode_errors` from all output connectors

            - `num_transport_errors` from all output connectors'
          minimum: 0
    RustCompilationInfo:
      type: object
      description: Rust compilation information.
      required:
      - exit_code
      - stdout
      - stderr
      properties:
        exit_code:
          type: integer
          format: int32
          description: Exit code of the `cargo` compilation command.
        stderr:
          type: string
          description: Output printed to stderr by the `cargo` compilation command.
        stdout:
          type: string
          description: Output printed to stdout by the `cargo` compilation command.
    OutputEndpointConfig:
      allOf:
      - $ref: '#/components/schemas/ConnectorConfig'
      - type: object
        required:
        - stream
        properties:
          stream:
            type: string
            description: 'The name of the output stream of the circuit that this endpoint is

              connected to.'
      description: Describes an output connector configuration
    ClockConfig:
      type: object
      required:
      - clock_resolution_usecs
      properties:
        clock_resolution_usecs:
          type: integer
          format: int64
          minimum: 0
        http_driven:
          type: boolean
          description: 'If `true`, the clock does not advance on wall-clock cadence.

            `NOW()` is held at its current value and only advances when an

            external caller invokes the pipeline''s `POST /clock/advance`

            endpoint.  Populated from `DevTweaks::now_http_driven`.'
        now_offset_ms:
          type: integer
          format: int64
          description: 'Target value for `NOW()` at the worker''s first emitted tick, in

            milliseconds since the Unix epoch.


            Populated verbatim from `DevTweaks::now_offset` at endpoint

            construction; the wall-clock delta is computed inside the

            connector''s worker task from a single `SystemTime::now()`

            reading, so there is no drift between config construction and

            the first emitted tick.  `None` means no shift is applied.'
          nullable: true
    PubSubInputConfig:
      type: object
      description: Google Pub/Sub input connector configuration.
      required:
      - subscription
      properties:
        connect_timeout_seconds:
          type: integer
          format: int32
          description: gRPC connection timeout.
          nullable: true
          minimum: 0
        credentials:
          type: string
          description: 'The content of a Google Cloud credentials JSON file.


            When this option is specified, the connector will use the provided credentials for

            authentication.  Otherwise, it will use Application Default Credentials (ADC) configured

            in the environment where the Feldera service is running.  See

            [Google Cloud documentation](https://cloud.google.com/docs/authentication/provide-credentials-adc)

            for information on configuring application default credentials.


            When running Feldera in an environment where ADC are not configured,

            e.g., a Docker container, use this option to ship Google Cloud credentials from another environment.

            For example, if you use the

            [`gcloud auth application-default login`](https://cloud.google.com/pubsub/docs/authentication#client-libs)

            command for authentication in your local development environment, ADC are stored in the

            `.config/gcloud/application_default_credentials.json` file in your home directory.'
          nullable: true
        emulator:
          type: string
          description: 'Set in order to use a Pub/Sub [emulator](https://cloud.google.com/pubsub/docs/emulator)

            instead of the production service, e.g., ''localhost:8681''.'
          nullable: true
        endpoint:
          type: string
          description: Override the default service endpoint 'pubsub.googleapis.com'
          nullable: true
        pool_size:
          type: integer
          format: int32
          description: gRPC channel pool size.
          nullable: true
          minimum: 0
        project_id:
          type: string
          description: 'Google Cloud project_id.


            When not specified, the connector will use the project id associated

            with the authenticated account.'
          nullable: true
        snapshot:
          type: string
          description: 'Reset subscription''s backlog to a given snapshot on startup,

            using the Pub/Sub `Seek` API.


            This option is mutually exclusive with the `timestamp` option.'
          nullable: true
        subscription:
          type: string
          description: Subscription name.
        timeout_seconds:
          type: integer
          format: int32
          description: gRPC request timeout.
          nullable: true
          minimum: 0
        timestamp:
          type: string
          description: 'Reset subscription''s backlog to a given timestamp on startup,

            using the Pub/Sub `Seek` API.


            The value of this option is an ISO 8601-encoded UTC time, e.g., "2024-08-17T16:39:57-08:00".


            This option is mutually exclusive with the `snapshot` option.'
          nullable: true
    DeltaTableTransactionMode:
      type: string
      description: 'Delta table transaction mode.


        Determines how the connector breaks up its input into transactions.


        * `none` - the connector does not break up its input into transactions.

        * `snapshot` - ingest the initial snapshot of the table in one or several transactions. If the connector is

        configured in the `snapshot_and_follow` mode, it will ingest the transaction log of the table without transactions.

        * `catchup` - batch the initial snapshot and transaction-log catch-up into Feldera transactions (see below).

        * `always` - all updates generated by the connector are broken up into transactions, both during the initial snapshot

        and when following the transaction log.


        # How table snapshot is ingested using transactions


        If the connector is configured in the `snapshot` or `snapshot_and_follow` mode, and its

        `transaction_mode` is set to `snapshot`, `catchup`, or `always`, it will ingest the snapshot of the

        table in one or several transactions. The exact behavior depends on the value of the `timestamp_column` option.

        If `timestamp_column` is not set, `catchup` and `always` ingest the snapshot in one Feldera transaction; `snapshot`

        mode uses the same one-transaction behavior when `timestamp_column` is not set.


        If `timestamp_column` is set, the connector will ingest the snapshot of the table in a series of batches, one for

        each timestamp range of width equal to the `LATENESS` attribute of the `timestamp_column`. Each range will be

        ingested in a separate transaction.


        See `timestamp_column` documentation for more details.


        # How transaction log is ingested using transactions


        If the connector is configured in the `follow`, `snapshot_and_follow`, or `cdc` mode, and its

        `transaction_mode` is set to `catchup`, it ingests the transaction log in batches. When it starts a

        Feldera transaction, it reads the latest available version of the Delta table (capped by `end_version` if set) and

        ingests all log entries up to and including that version in a single Feldera transaction before committing. It then

        repeats for subsequent versions as they appear in the log.


        The `catchup` mode offers the most efficient way for the connector to process the entire contents

        of the table during backfill and keep up with table changes in steady state.


        If `transaction_mode` is set to `always`, the connector ingests the transaction log in a series of transactions,

        generating exactly one Feldera transaction for each entry in the table''s transaction log. Feldera transaction

        boundaries then match the transaction boundaries of the Delta Lake table: as long as the table keeps changing, each log

        entry initiates a new Feldera transaction. Use `always` when that one-to-one alignment is required.'
      enum:
      - none
      - snapshot
      - always
      - catchup
    HeaderFilter:
      oneOf:
      - type: object
        required:
        - header
        properties:
          header:
            $ref: '#/components/schemas/HeaderMatch'
      - type: object
        required:
        - and
        properties:
          and:
            type: array
            items:
              $ref: '#/components/schemas/HeaderFilter'
            description: 'Conjunction: matches when every nested filter matches.  Must have at

              least one operand.'
      - type: object
        required:
        - or
        properties:
          or:
            type: array
            items:
              $ref: '#/components/schemas/HeaderFilter'
            description: 'Disjunction: matches when at least one nested filter matches.  Must have

              at least one operand.'
      - type: object
        required:
        - not
        properties:
          not:
            $ref: '#/components/schemas/HeaderFilter'
      description: 'A boolean filter over the headers of a Kafka message.


        The Kafka input connector uses this to drop messages whose headers do not

        satisfy a predicate.  It is a tree of boolean operators (`and`, `or`, `not`)

        whose leaves are regular expression tests on individual header values.  It

        serializes as an externally tagged JSON object, for example:


        ```json

        {

        "and": [

        { "header": { "name": "event-type", "pattern": "created|updated" } },

        { "not": { "header": { "name": "source", "pattern": "test-.*" } } }

        ]

        }

        ```


        This admits a message only if it has an `event-type` header valued exactly

        `created` or `updated` and does not have a `source` header whose value

        starts with `test-`.'
    PostgresCdcReaderConfig:
      allOf:
      - type: object
        description: TLS/SSL configuration for PostgreSQL connectors.
        properties:
          ssl_ca_location:
            type: string
            description: Path to a file containing a sequence of CA certificates in PEM format.
            nullable: true
          ssl_ca_pem:
            type: string
            description: A sequence of CA certificates in PEM format.
            nullable: true
          ssl_certificate_chain_location:
            type: string
            description: 'The path to the certificate chain file.

              The file must contain a sequence of PEM-formatted certificates,

              the first being the leaf certificate, and the remainder forming

              the chain of certificates up to and including the trusted root certificate.'
            nullable: true
          ssl_client_key:
            type: string
            description: The client certificate key in PEM format.
            nullable: true
          ssl_client_key_location:
            type: string
            description: Path to the client certificate key.
            nullable: true
          ssl_client_location:
            type: string
            description: Path to the client certificate.
            nullable: true
          ssl_client_pem:
            type: string
            description: The client certificate in PEM format.
            nullable: true
          verify_hostname:
            type: boolean
            description: True to enable hostname verification when using TLS. True by default.
            nullable: true
      - type: object
        required:
        - uri
        - publication
        - source_table
        properties:
          publication:
            type: string
            description: Name of the pre-created Postgres publication to replicate from.
          source_table:
            type: string
            description: 'Postgres table to replicate (e.g. "public.orders").

              Must be included in the publication.'
          uri:
            type: string
            description: 'Postgres connection URI. The user must have REPLICATION privilege.

              See: <https://docs.rs/tokio-postgres/0.7.12/tokio_postgres/config/struct.Config.html>'
      description: 'Postgres CDC input connector configuration.


        Uses logical replication to capture ongoing changes from a Postgres database.

        Requires a pre-created publication and a user with REPLICATION privilege.

        Tables must have primary keys and `REPLICA IDENTITY FULL` is recommended

        for UPDATE/DELETE support.'
    NexmarkInputConfig:
      type: object
      description: 'Configuration for generating Nexmark input data.


        This connector must be used exactly three times in a pipeline if it is used

        at all, once for each [`NexmarkTable`].'
      required:
      - table
      properties:
        options:
          allOf:
          - $ref: '#/components/schemas/NexmarkInputOptions'
          nullable: true
        table:
          $ref: '#/components/schemas/NexmarkTable'
    PreprocessorConfig:
      type: object
      description: Configuration for describing a preprocessor
      required:
      - name
      - message_oriented
      - config
      properties:
        config:
          description: Arbitrary additional configuration.
        message_oriented:
          type: boolean
          description: 'True if the preprocessor is message-oriented: true if each preprocessor

            output record corresponds to a whole number of of parser records.'
        name:
          type: string
          description: 'Name of the preprocessor.

            All preprocessors with the same name will perform the same task.'
    ConnectorConfig:
      allOf:
      - $ref: '#/components/schemas/OutputBufferConfig'
      - type: object
        required:
        - transport
        properties:
          format:
            allOf:
            - $ref: '#/components/schemas/FormatConfig'
            nullable: true
          index:
            type: string
            description: 'Name of the index that the connector is attached to.


              This property is valid for output connectors only.  It is used with data

              transports and formats that expect output updates in the form of key/value

              pairs, where the key typically represents a unique id associated with the

              table or view.


              To support such output formats, an output connector can be attached to an

              index created using the SQL CREATE INDEX statement.  An index of a table

              or view contains the same updates as the table or view itself, indexed by

              one or more key columns.


              See individual connector documentation for details on how they work

              with indexes.'
            nullable: true
          labels:
            type: array
            items:
              type: string
            description: 'Arbitrary user-defined text labels associated with the connector.


              These labels can be used in conjunction with the `start_after` property

              to control the start order of connectors.'
          max_batch_size:
            type: integer
            format: int64
            description: 'Maximum number of records from this connector to process in a single batch.


              When set, this caps how many records are taken from the connector’s input

              buffer and pushed through the circuit at once.


              This is typically configured lower than `max_queued_records` to allow the

              connector time to restart and refill its buffer while a batch is being

              processed.


              Not all input adapters honor this limit.


              If this is not set, the batch size is derived from `max_worker_batch_size`.'
            nullable: true
            minimum: 0
          max_queued_bytes:
            type: integer
            format: int64
            description: 'Backpressure threshold, in bytes.


              Maximal number of bytes queued by the endpoint before the endpoint

              is paused by the backpressure mechanism.


              For input endpoints, this setting bounds the number of bytes that have

              been received from the input transport but haven''t yet been consumed by

              the circuit since the circuit, since the circuit is still busy processing

              previous inputs.


              This setting is not yet implemented for output endpoints.


              Note that this is not a hard bound: there can be a small delay between

              the backpressure mechanism is triggered and the endpoint is paused, during

              which more data may be queued.


              When this is unspecified, it defaults to `1000 * max_queued_records`.'
            nullable: true
            minimum: 0
          max_queued_records:
            type: integer
            format: int64
            description: 'Backpressure threshold, in records.


              Maximal number of records queued by the endpoint before the endpoint

              is paused by the backpressure mechanism.


              For input endpoints, this setting bounds the number of records that have

              been received from the input transport but haven''t yet been consumed by

              the circuit, since the circuit is still busy processing previous inputs.


              For output endpoints, this setting bounds the number of records that have

              been produced by the circuit but not yet sent via the output transport endpoint

              nor stored in the output buffer (see `enable_output_buffer`).


              Note that this is not a hard bound: there can be a small delay between

              the backpressure mechanism is triggered and the endpoint is paused, during

              which more data may be queued.


              The default is 1 million.'
            minimum: 0
          max_worker_batch_size:
            type: integer
            format: int64
            description: 'Maximum number of records processed per batch, per worker thread.


              When `max_batch_size` is not set, this setting is used to cap

              the number of records that can be taken from the connector’s input

              buffer and pushed through the circuit at once.  The effective batch size is computed as:

              `max_worker_batch_size × workers`.


              This provides an alternative to `max_batch_size` that automatically adjusts batch

              size as the number of worker threads changes to maintain constant amount of

              work per worker per batch.


              Defaults to 10,000 records per worker.'
            nullable: true
            minimum: 0
          paused:
            type: boolean
            description: 'Create connector in paused state.


              The default is `false`.'
          postprocessor:
            type: array
            items:
              $ref: '#/components/schemas/PostprocessorConfig'
            description: Optional postprocessor configuration
            nullable: true
          preprocessor:
            type: array
            items:
              $ref: '#/components/schemas/PreprocessorConfig'
            description: Optional preprocessor configuration
            nullable: true
          send_snapshot:
            type: boolean
            description: 'Send a full snapshot of a materialized view when the connector first

              starts. Valid for output connectors only.


              When `true`, the pipeline emits the current contents of the view as the

              initial batch the first time the connector runs. The view must be

              materialized (declared with `CREATE MATERIALIZED VIEW`).


              The snapshot is sent exactly once per connector lifetime: it does not

              fire again when the pipeline resumes from a checkpoint. Modifying the

              connector configuration or invoking the reset API triggers a fresh

              snapshot when the connector supports reset (e.g., Delta Lake in

              `truncate` mode and Postgres).'
          start_after:
            type: array
            items:
              type: string
            description: 'Start the connector after all connectors with specified labels.


              This property is used to control the start order of connectors.

              The connector will not start until all connectors with the specified

              labels have finished processing all inputs.'
            nullable: true
          transport:
            $ref: '#/components/schemas/TransportConfig'
    S3TablesCatalogConfig:
      type: object
      description: Amazon S3 Tables catalog config.
      properties:
        s3tables.access-key-id:
          type: string
          description: Access key id used to access the S3 Tables catalog.
          nullable: true
        s3tables.endpoint:
          type: string
          description: 'Custom endpoint URL for the S3 Tables service.


            Primarily used to target a local or mock S3 Tables implementation for testing.

            When omitted, the default regional endpoint is used.'
          nullable: true
        s3tables.profile-name:
          type: string
          description: Profile used to access the S3 Tables catalog.
          nullable: true
        s3tables.region:
          type: string
          description: Region of the S3 Tables catalog.
          nullable: true
        s3tables.secret-access-key:
          type: string
          description: Secret access key used to access the S3 Tables catalog.
          nullable: true
        s3tables.session-token:
          type: string
          description: Static session token used to access the S3 Tables catalog.
          nullable: true
        s3tables.table-bucket-arn:
          type: string
          description: 'ARN of the S3 table bucket that contains the table.


            Note that this is the ARN of the table *bucket*, not of an individual table,

            e.g., `"arn:aws:s3tables:us-east-2:123456789012:bucket/my-bucket"`.'
          nullable: true
    CheckpointSyncResponse:
      type: object
      description: Response to a sync checkpoint request.
      required:
      - checkpoint_uuid
      properties:
        checkpoint_uuid:
          type: string
          format: uuid
    ClientMetadata:
      type: object
      description: 'Client-generated data stored alongside a pipeline.


        The fields are stored together as a single JSON object in the

        `client_metadata` text column, so adding a field needs no migration.

        Deserialization is lenient: missing keys take their default and unknown

        keys are ignored. [`PatchClientMetadata`] is the optional, per-field form

        used by `PATCH` request bodies.'
      properties:
        description:
          type: string
          description: Human-readable description of the pipeline. Default is an empty string.
        tags:
          type: array
          items:
            type: string
          description: 'Free-form labels used to organize, group, and filter pipelines.

            Default is no tags (empty vector).'
    CheckpointFailure:
      type: object
      description: Information about a failed checkpoint.
      required:
      - sequence_number
      - error
      - failed_at
      properties:
        error:
          type: string
          description: Error message associated with the failure.
        failed_at:
          type: string
          format: date-time
          description: When the failure occurred (serialized as ISO 8601).
        sequence_number:
          type: integer
          format: int64
          description: Sequence number of the failed checkpoint.
          minimum: 0
    ResourcesStatus:
      type: string
      description: 'Pipeline resources status.


        ```text

        /start (early start or provision check failed)

        ┌───┐

        │   ▼

        Stopped ◄────────── Stopping

        /start │                   ▲

        │                   │ /stop?force=true

        │                   │ OR: timeout (from Provisioning)

        ▼                   │ OR: fatal runtime or resource error

        ⌛Provisioning ────────────│ OR: runtime status is Suspended

        │                   │

        │                   │

        ▼                   │

        Provisioned ─────────────┘

        ```


        ### Desired and actual status


        We use the desired state model to manage the lifecycle of a pipeline. In this model, the

        pipeline has two status attributes associated with it: the **desired** status, which represents

        what the user would like the pipeline to do, and the **current** status, which represents the

        actual (last observed) status of the pipeline. The pipeline runner service continuously monitors

        the desired status field to decide where to steer the pipeline towards.


        There are two desired statuses:

        - `Provisioned` (set by invoking `/start`)

        - `Stopped` (set by invoking `/stop?force=true`)


        The user can monitor the current status of the pipeline via the `GET /v0/pipelines/{name}`

        endpoint. In a typical scenario, the user first sets the desired status, e.g., by invoking the

        `/start` endpoint, and then polls the `GET /v0/pipelines/{name}` endpoint to monitor the actual

        status of the pipeline until its `deployment_resources_status` attribute changes to

        `Provisioned` indicating that the pipeline has been successfully provisioned, or `Stopped` with

        `deployment_error` being set.'
      enum:
      - Stopped
      - Provisioning
      - Provisioned
      - Stopping
    FtModel:
      type: string
      description: 'Fault tolerance model.


        The ordering is significant: we consider [Self::ExactlyOnce] to be a "higher

        level" of fault tolerance than [Self::AtLeastOnce].'
      enum:
      - at_least_once
      - exactly_once
    SourcePosition:
      type: object
      required:
      - start_line_number
      - start_column
      - end_line_number
      - end_column
      properties:
        end_column:
          type: integer
          minimum: 0
        end_line_number:
          type: integer
          minimum: 0
        start_column:
          type: integer
          minimum: 0
        start_line_number:
          type: integer
          minimum: 0
    InputEndpointConfig:
      allOf:
      - $ref: '#/components/schemas/ConnectorConfig'
      - type: object
        required:
        - stream
        properties:
          stream:
            type: string
            description: 'The name of the input stream of the circuit that this endpoint is

              connected to.'
      description: Describes an input connector configuration
    KafkaInputConfig:
      type: object
      description: Configuration for reading data from Kafka topics with `InputTransport`.
      required:
      - topic
      - resume_earliest_if_data_expires
      properties:
        group_join_timeout_secs:
          type: integer
          format: int32
          description: 'Maximum timeout in seconds to wait for the endpoint to join the Kafka

            consumer group during initialization.'
          minimum: 0
        header_filter:
          allOf:
          - $ref: '#/components/schemas/HeaderFilter'
          nullable: true
        include_headers:
          type: boolean
          description: 'Whether to include Kafka headers in the record metadata.


            When `true`, Kafka message headers are available via the `CONNECTOR_METADATA()` function.

            See <https://docs.feldera.com/connectors/sources/kafka#metadata> for details.'
          nullable: true
        include_offset:
          type: boolean
          description: 'Whether to include Kafka message offset in the record metadata.


            When `true`, Kafka message offset is available via the `CONNECTOR_METADATA()` function.

            See <https://docs.feldera.com/connectors/sources/kafka#metadata> for details.'
          nullable: true
        include_partition:
          type: boolean
          description: 'Whether to include Kafka partition in the record metadata.


            When `true`, Kafka partition from which the message was read is available via the `CONNECTOR_METADATA()` function.

            See <https://docs.feldera.com/connectors/sources/kafka#metadata> for details.'
          nullable: true
        include_timestamp:
          type: boolean
          description: 'Whether to include Kafka message timestamp in the record metadata.


            When `true`, Kafka message timestamp is available via the `CONNECTOR_METADATA()` function.

            See <https://docs.feldera.com/connectors/sources/kafka#metadata> for details.'
          nullable: true
        include_topic:
          type: boolean
          description: 'Whether to include Kafka topic in the record metadata.


            When `true`, Kafka topic from which the message was read is available via the `CONNECTOR_METADATA()` function.

            See <https://docs.feldera.com/connectors/sources/kafka#metadata> for details.'
          nullable: true
        log_level:
          allOf:
          - $ref: '#/components/schemas/KafkaLogLevel'
          nullable: true
        partitions:
          type: array
          items:
            type: integer
            format: int32
          description: 'The list of Kafka partitions to read from.


            Only the specified partitions will be consumed. If this field is not set,

            the connector will consume from all available partitions.


            If `start_from` is set to `offsets` and this field is provided, the

            number of partitions must exactly match the number of offsets, and the

            order of partitions must correspond to the order of offsets.


            If offsets are provided for all partitions, this field can be omitted.'
          nullable: true
        poller_threads:
          type: integer
          description: 'Set to 1 or more to fix the number of threads used to poll

            `rdkafka`. Multiple threads can increase performance with small Kafka

            messages; for large messages, one thread is enough. In either case, too

            many threads can harm performance. If unset, the default is 3, which

            helps with small messages but will not harm performance with large

            messagee'
          nullable: true
          minimum: 0
        region:
          type: string
          description: The AWS region to use while connecting to AWS Managed Streaming for Kafka (MSK).
          nullable: true
        resume_earliest_if_data_expires:
          type: boolean
          description: 'By default, if the input connector resumes from a checkpoint and the

            data where it needs to resume has expired from the Kafka topic, the

            input connector fails initialization and the pipeline will fail to start.


            Set this to true to change the behavior so that, if data is not

            available on resume, the input connector starts from the earliest

            offsets that are now available.'
        start_from:
          $ref: '#/components/schemas/KafkaStartFromConfig'
        synchronize_partitions:
          type: boolean
          description: 'When lateness is enabled on a Feldera table, Feldera only produces

            correct output if input arrives approximately in order within the bounds

            of the lateness.  The Feldera Kafka input connector can reorder input

            when there are multiple partitions:


            - If partitions start at different times, then reading all the

            partitions in parallel will naturally consume data out of order.


            - Even if they start at the same time, partitions might contain events

            at different rates.


            - Even if the partitions start at the same time and have the same number

            of events per unit time, if partitions are spread across brokers,

            different brokers may fetch data at different rates.


            - Even if all of the partitions are on a single broker, one cannot

            expect all of the partitions to naturally remain exactly in sync

            forever.


            Setting this option to `true` addresses the issue by synchronizing

            ingestion across partitions, ingesting records in order of their Kafka

            event timestamps.


            Pitfalls of this solution include:


            - Kafka event timestamps are not necessarily monotonically increasing

            even within a single partition.  If timestamps jump backward beyond

            the lateness, then this can also cause correctness problems.


            (This can be avoided by keeping clocks on Kafka producers and brokers

            synchronized.)


            - If an event with a timestamp far in the future is added to a

            partition, that event, and all those that follow it, will never be

            processed.


            - If one or a few partitions have timestamps far behind the others, only

            those partitions will be processed until all the old events are

            processed.  (This is the flip side of the previous pitfall.)


            - One or more empty partitions will prevent any data from being

            processed at all, because there is no way to know the timestamp for

            the first event that will be added to that partition.


            - In a topic with `N` nonempty partitions, at least `N - 1` events will

            always be left unprocessed (one in each of `N - 1` partitions), because

            there is no way to know the timestamp for the next event to be added to

            the partition whose events have been completely processed.'
        topic:
          type: string
          description: Topic to subscribe to.
      additionalProperties:
        type: string
        description: 'Options passed directly to `rdkafka`.


          [`librdkafka` options](https://github.com/edenhill/librdkafka/blob/master/CONFIGURATION.md)

          used to configure the Kafka consumer.


          This input connector does not use consumer groups, so options related to

          consumer groups are rejected, including:


          * `group.id`, if present, is ignored.

          * `auto.offset.reset` (use `start_from` instead).

          * "enable.auto.commit", if present, must be set to "false".

          * "enable.auto.offset.store", if present, must be set to "false".'
    KafkaLogLevel:
      type: string
      description: Kafka logging levels.
      enum:
      - emerg
      - alert
      - critical
      - error
      - warning
      - notice
      - info
      - debug
    HeaderMatch:
      type: object
      description: 'A leaf of a [`HeaderFilter`]: a regular expression tested against the value

        of a named Kafka header.'
      required:
      - name
      - pattern
      properties:
        name:
          type: string
          description: Name of the header to test, matched exactly against the header key.
        pattern:
          type: string
          description: 'Regular expression ([Rust `regex` crate

            syntax](https://docs.rs/regex/latest/regex/#syntax)) tested against the

            header value.


            The value is matched as raw bytes, so non-UTF-8 values and byte patterns

            work.  The pattern must match the *entire* value: it is anchored

            automatically, so `^`/`$` are unnecessary (though harmless).  A header

            present with a null value is matched as an empty byte sequence; a header

            that appears more than once matches if any of its values match.'
    KafkaStartFromConfig:
      oneOf:
      - type: string
        description: Start from the beginning of the topic.
        enum:
        - earliest
      - type: string
        description: 'Start from the current end of the topic.


          This will only read any data that is added to the topic after the

          connector initializes.'
        enum:
        - latest
      - type: object
        required:
        - offsets
        properties:
          offsets:
            type: array
            items:
              type: integer
              format: int64
            description: 'Start from particular offsets in the topic.


              The number of offsets must match the number of partitions in the topic.'
      - type: object
        required:
        - timestamp
        properties:
          timestamp:
            type: integer
            format: int64
            description: 'Start from a particular timestamp in the topic.


              Kafka timestamps are in milliseconds since the epoch.'
      description: Where to begin reading a Kafka topic.
    BufferCacheStrategy:
      type: string
      description: Selects which eviction strategy backs a cache instance.
      enum:
      - s3_fifo
      - lru
    ResourcesDesiredStatus:
      type: string
      enum:
      - Stopped
      - Provisioned
    SqlIdentifier:
      type: object
      description: 'An SQL identifier.


        This struct is used to represent SQL identifiers in a canonical form.

        We store table names or field names as identifiers in the schema.'
      required:
      - name
      - case_sensitive
      properties:
        case_sensitive:
          type: boolean
        name:
          type: string
    GenerationPlan:
      type: object
      description: A random generation plan for a table that generates either a limited amount of rows or runs continuously.
      properties:
        fields:
          type: object
          description: Specifies the values that the generator should produce.
          default: {}
          additionalProperties:
            $ref: '#/components/schemas/RngFieldSettings'
        limit:
          type: integer
          description: 'Total number of new rows to generate.


            If not set, the generator will produce new/unique records as long as the pipeline is running.

            If set to 0, the table will always remain empty.

            If set, the generator will produce new records until the specified limit is reached.


            Note that if the table has one or more primary keys that don''t use the `increment` strategy to

            generate the key there is a potential that an update is generated instead of an insert. In

            this case it''s possible the total number of records is less than the specified limit.'
          default: null
          nullable: true
          minimum: 0
        rate:
          type: integer
          format: int32
          description: 'Non-zero number of rows to generate per second.


            If not set, the generator will produce rows as fast as possible.'
          default: null
          nullable: true
          minimum: 0
        worker_chunk_size:
          type: integer
          description: 'When multiple workers are used, each worker will pick a consecutive "chunk" of

            records to generate.


            By default, if not specified, the generator will use the formula `min(rate, 10_000)`

            to determine it. This works well in most situations. However, if you''re

            running tests with lateness and many workers you can e.g., reduce the

            chunk size to make sure a smaller range of records is being ingested in parallel.


            This also controls the sizes of input batches.  If, for example, `rate`

            and `worker_chunk_size` are both 1000, with a single worker, the

            generator will output 1000 records once a second.  But if we reduce

            `worker_chunk_size` to 100 without changing `rate`, the generator will

            instead output 100 records 10 times per second.


            # Example

            Assume you generate a total of 125 records with 4 workers and a chunk size of 25.

            In this case, worker A will generate records 0..25, worker B will generate records 25..50,

            etc. A, B, C, and D will generate records in parallel. The first worker to finish its chunk

            will pick up the last chunk of records (100..125) to generate.'
          default: null
          nullable: true
          minimum: 0
      additionalProperties: false
    Relation:
      allOf:
      - $ref: '#/components/schemas/SqlIdentifier'
      - type: object
        required:
        - fields
        properties:
          fields:
            type: array
            items:
              $ref: '#/components/schemas/Field'
          materialized:
            type: boolean
          primary_key:
            type: array
            items:
              type: string
            nullable: true
          properties:
            type: object
            additionalProperties:
              $ref: '#/components/schemas/PropertyValue'
      description: 'A SQL table or view. It has a name and a list of fields.


        Matches the Calcite JSON format.'
    NexmarkInputOptions:
      type: object
      description: Configuration for generating Nexmark input data.
      properties:
        batch_size_per_thread:
          type: integer
          format: int64
          description: 'Number of events to generate and submit together, per thread.


            Each thread generates this many records, which are then combined with

            the records generated by the other threads, to form combined input

            batches of size `threads × batch_size_per_thread`.'
          default: 1000
          minimum: 0
        events:
          type: integer
          format: int64
          description: Number of events to generate.
          default: 100000000
          minimum: 0
        max_step_size_per_thread:
          type: integer
          format: int64
          description: 'Maximum number of events to submit in a single step, per thread.


            This should really be per worker thread, not per generator thread, but

            the connector does not know how many worker threads there are.


            This stands in for `max_batch_size` from the connector configuration

            because it must be a constant across all three of the nexmark tables.'
          default: 10000
          minimum: 0
        threads:
          type: integer
          description: 'Number of event generator threads.


            It''s reasonable to choose the same number of generator threads as worker

            threads.'
          default: 4
          minimum: 0
    RuntimeStatus:
      type: string
      description: 'Runtime status of the pipeline.


        Of the statuses, only `Unavailable` is determined by the runner. All other statuses are

        determined by the pipeline and taken over by the runner.'
      enum:
      - Unavailable
      - Coordination
      - Standby
      - Initializing
      - AwaitingApproval
      - Bootstrapping
      - Replaying
      - Paused
      - Running
      - Suspended
      - ConcurrentBootstrapping
      - Synchronizing
    RuntimeDesiredStatus:
      type: string
      enum:
      - Unavailable
      - Coordination
      - Standby
      - Paused
      - Running
      - Suspended
    DeltaTableIngestMode:
      type: string
      description: 'Delta table read mode.


        Three options are available:


        * `snapshot` - read a snapshot of the table and stop.


        * `follow` - continuously ingest changes to the table, starting from a specified version

        or timestamp.


        * `snapshot_and_follow` - read a snapshot of the table before switching to continuous ingestion

        mode.'
      enum:
      - snapshot
      - follow
      - snapshot_and_follow
      - cdc
    NexmarkTable:
      type: string
      description: Table in Nexmark.
      enum:
      - bid
      - auction
      - person
    FileOutputConfig:
      type: object
      description: Configuration for writing data to a file with `FileOutputTransport`.
      required:
      - path
      properties:
        path:
          type: string
          description: File path.
    KafkaOutputFtConfig:
      type: object
      description: Fault tolerance configuration for Kafka output connector.
      properties:
        consumer_options:
          type: object
          description: 'Options passed to `rdkafka` for consumers only, as documented at

            [`librdkafka`

            options](https://github.com/edenhill/librdkafka/blob/master/CONFIGURATION.md).


            These options override `kafka_options` for consumers, and may be empty.'
          default: {}
          additionalProperties:
            type: string
        producer_options:
          type: object
          description: 'Options passed to `rdkafka` for producers only, as documented at

            [`librdkafka`

            options](https://github.com/edenhill/librdkafka/blob/master/CONFIGURATION.md).


            These options override `kafka_options` for producers, and may be empty.'
          default: {}
          additionalProperties:
            type: string
  securitySchemes:
    JSON web token (JWT) or API key:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Use a JWT token obtained via an OAuth2/OIDC\n                               login workflow or an API key obtained via\n                               the `/v0/api-keys` endpoint."
