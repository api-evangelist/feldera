                    min_step_storage_bytes: null
                    compression: default
                    cache_mib: null
                  fault_tolerance:
                    model: none
                    checkpoint_interval_secs: 60
                  cpu_profiler: true
                  tracing: false
                  tracing_endpoint_jaeger: ''
                  min_batch_size_records: 0
                  max_buffering_delay_usecs: 0
                  resources:
                    cpu_cores_min: null
                    cpu_cores_max: null
                    memory_mb_min: null
                    memory_mb_max: null
                    storage_mb_max: null
                    storage_class: null
                    service_account_name: null
