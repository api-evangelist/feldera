          minimum: 0
        stream_name:
          type: string
    RuntimeConfig:
      type: object
      description: 'Global pipeline configuration settings. This is the publicly

        exposed type for users to configure pipelines.'
      properties:
        checkpoint_during_suspend:
          type: boolean
          description: 'Deprecated: setting this true or false does not have an effect anymore.'
          default: true
        clock_resolution_usecs:
          type: integer
          format: int64
          description: 'Real-time clock resolution in microseconds.


            This parameter controls the execution of queries that use the `NOW()` function.  The output of such

            queries depends on the real-time clock and can change over time without any external

            inputs.  If the query uses `NOW()`, the pipeline will update the clock value and trigger incremental

            recomputation at most each `clock_resolution_usecs` microseconds.  If the query does not use

            `NOW()`, then clock value updates are suppressed and the pipeline ignores this setting.


            It is set to 1 second (1,000,000 microseconds) by default.'
          default: 1000000
          nullable: true
          minimum: 0
        cpu_profiler:
          type: boolean
          description: 'Enable CPU profiler.


            The default value is `true`.'
          default: true
        datafusion_memory_mb:
          type: integer
          format: int64
          description: 'DataFusion memory pool size, in MB, shared by the ad-hoc query

            engine and the Delta Lake / Iceberg connectors.


            Carved out of `max_rss_mb` (falling back to

            `resources.memory_mb_max`); the remainder goes to the DBSP circuit,

            so the two do not double-book RAM.


            Unset: defaults to 5% of the effective budget, capped at 2 GB.

            Pipelines that don''t run heavy ad-hoc / Delta / Iceberg workloads

            can leave this unset.


            Sort/aggregate-heavy ad-hoc queries (especially at high `workers`

            counts) should set this explicitly. An under-sized pool surfaces as

            `ResourcesExhausted` on the failing query — the pipeline keeps

            running and only that query fails.


            No pool limit applied if no overall budget is configured.


            See [documentation on the pipeline''s memory usage](https://docs.feldera.com/operations/memory)

            for more details.'
          default: null
          nullable: true
          minimum: 0
        dev_tweaks:
          allOf:
          - $ref: '#/components/schemas/DevTweaks'
          default: {}
        env:
          type: object
          description: 'Environment variables for the pipeline process.


            These are key-value pairs injected into the pipeline process environment.

            Some variable names are reserved by the platform and cannot be overridden

            (for example `RUST_LOG`, and variables in the `FELDERA_`,

            `KUBERNETES_`, and `TOKIO_` namespaces).'
          default: {}
          additionalProperties:
            type: string
        fault_tolerance:
          allOf:
          - $ref: '#/components/schemas/FtConfig'
          default:
            model: none
            checkpoint_interval_secs: 60
        hosts:
          type: integer
          description: 'Number of DBSP hosts.


            The worker threads are evenly divided among the hosts.  For single-host

            deployments, this should be 1 (the default).


            Multihost pipelines are an enterprise-only preview feature.'
          default: 1
          minimum: 0
        http_workers:
          type: integer
          format: int64
          description: 'Sets the number of available runtime threads for the http server.


            In most cases, this does not need to be set explicitly and

            the default is sufficient. Can be increased in case the

            pipeline HTTP API operations are a bottleneck.


            If not specified, the default is set to `workers`.'
          default: null
          nullable: true
          minimum: 0
        init_containers:
          description: Specification of additional (sidecar) containers.
          nullable: true
        io_workers:
          type: integer
          format: int64
          description: 'Sets the number of available runtime threads for async IO tasks.


            This affects some networking and file I/O operations

            especially adapters and ad-hoc queries.


            In most cases, this does not need to be set explicitly and

            the default is sufficient. Can be increased in case

            ingress, egress or ad-hoc queries are a bottleneck.


            If not specified, the default is set to `workers`.'
          default: null
          nullable: true
          minimum: 0
        logging:
          type: string
          description: 'Log filtering directives.


            If set to a valid [tracing-subscriber] filter, this controls the log

            messages emitted by the pipeline process.  Otherwise, or if the filter

            has invalid syntax, messages at "info" severity and higher are written

            to the log and all others are discarded.


            [tracing-subscriber]: https://docs.rs/tracing-subscriber/latest/tracing_subscriber/filter/struct.EnvFilter.html#directives'
          default: null
          nullable: true
        max_buffering_delay_usecs:
          type: integer
          format: int64
          description: 'Maximal delay in microseconds to wait for `min_batch_size_records` to

            get buffered by the controller, defaults to 0.'
          default: 0
          minimum: 0
        max_parallel_connector_init:
          type: integer
          format: int64
          description: 'The maximum number of connectors initialized in parallel during pipeline

            startup.


            At startup, the pipeline must initialize all of its input and output connectors.

            Depending on the number and types of connectors, this can take a long time.

            To accelerate the process, multiple connectors are initialized concurrently.

            This option controls the maximum number of connectors that can be initialized

            in parallel.


            The default is 10.'
          default: null
          nullable: true
          minimum: 0
        max_rss_mb:
          type: integer
          format: int64
          description: 'The maximum amount of memory, in Megabytes, that the pipeline is allowed to use

            on each host.


            Setting this property activates memory pressure monitoring and backpressure

            mechanisms. The pipeline will track the amount of remaining memory and

            report the memory pressure level via the `memory_pressure` metric.


            As the memory pressure increases, the system will apply increasing backpressure

            to push state cached in memory to storage, preventing the pipeline from running

            out of memory at the cost of some performance degradation.


            It is strongly recommended to set this property to prevent the pipeline from

            running out of memory. The setting should not exceed the memory limit of the pipeline

            instance.


            When `max_rss_mb` is not specified but `resources.memory_mb_max` is set, the

            latter is used as the effective memory cap for the pipeline.


            See [documentation on the pipeline''s memory usage](https://docs.feldera.com/operations/memory)

            for more details.'
          default: null
          nullable: true
          minimum: 0
        min_batch_size_records:
          type: integer
          format: int64
          description: 'Minimal input batch size.


            The controller delays pushing input records to the circuit until at

            least `min_batch_size_records` records have been received (total

            across all endpoints) or `max_buffering_delay_usecs` microseconds

            have passed since at least one input records has been buffered.

            Defaults to 0.'
          default: 0
          minimum: 0
        pin_cpus:
          type: array
          items:
            type: integer
            minimum: 0
          description: 'Optionally, a list of CPU numbers for CPUs to which the pipeline may pin

            its worker threads.  Specify at least twice as many CPU numbers as

            workers.  CPUs are generally numbered starting from 0.  The pipeline

            might not be able to honor CPU pinning requests.


            CPU pinning can make pipelines run faster and perform more consistently,

            as long as different pipelines running on the same machine are pinned to

            different CPUs.'
          default: []
        pipeline_template_configmap:
          allOf:
          - $ref: '#/components/schemas/PipelineTemplateConfig'
          default: null
          nullable: true
        provisioning_timeout_secs:
          type: integer
          format: int64
          description: 'Timeout in seconds for the `Provisioning` phase of the pipeline.

            Setting this value will override the default of the runner.'
          default: null
          nullable: true
          minimum: 0
        resources:
          allOf:
          - $ref: '#/components/schemas/ResourceConfig'
          default:
            cpu_cores_min: null
            cpu_cores_max: null
            memory_mb_min: null
            memory_mb_max: null
            storage_mb_max: null
            storage_class: null
            service_account_name: null
            namespace: null
        storage:
          allOf:
          - $ref: '#/components/schemas/StorageOptions'
          default:
            backend:
              name: default
            min_storage_bytes: null
            min_step_storage_bytes: null
            compression: default
            cache_mib: null
          nullable: true
        tracing:
          type: boolean
          description: Enable pipeline tracing.
          default: false
        tracing_endpoint_jaeger:
          type: string
          description: Jaeger tracing endpoint to send tracing information to.
          default: 127.0.0.1:6831
        workers:
          type: integer
          format: int32
          description: 'Number of DBSP worker threads.


            Each DBSP "foreground" worker thread is paired with a "background"

            thread for LSM merging, making the total number of threads twice the

            specified number.


            The typical sweet spot for the number of workers is between 4 and 16.

            Each worker increases overall memory consumption for data structures

            used during a step.'
          default: 8
          minimum: 0
    CheckpointSyncFailure:
      type: object
      description: Information about a failed checkpoint sync.
      required:
      - uuid
      - error
      properties:
        error:
          type: string
          description: Error message associated with the failure.
        uuid:
          type: string
          format: uuid
          description: UUID of the failed checkpoint.
    CheckpointStatus:
      type: object
      description: Checkpoint status returned by the `/checkpoint_status` endpoint.
      properties:
        failure:
          allOf:
          - $ref: '#/components/schemas/CheckpointFailure'
          nullable: true
        success:
          type: integer
          format: int64
          description: Most recently successful checkpoint.
          nullable: true
          minimum: 0
    ConnectOptions:
      type: object
      description: Options for connecting to a NATS server.
      required:
      - server_url
      properties:
        auth:
          $ref: '#/components/schemas/Auth'
        connection_timeout_secs:
          type: integer
          format: int64
          description: 'Connection timeout


            How long to wait when establishing the initial connection to the

            NATS server.'
          minimum: 0
        request_timeout_secs:
          type: integer
          format: int64
          description: 'Request timeout in seconds.


            How long to wait for responses to requests.'
          minimum: 0
        server_url:
          type: string
          description: NATS server URL (e.g., "nats://localhost:4222").
    StartTransactionResponse:
      type: object
      description: Response to a `/start_transaction` request.
      required:
      - transaction_id
      properties:
        transaction_id:
          type: integer
          format: int64
    ProgramConfig:
      type: object
      description: Program configuration.
      properties:
        cache:
          type: boolean
          description: 'If `true` (default), when a prior compilation with the same checksum

            already exists, the output of that (i.e., binary) is used.

            Set `false` to always trigger a new compilation, which might take longer

            and as well can result in overriding an existing binary.'
          default: true
        profile:
          allOf:
          - $ref: '#/components/schemas/CompilationProfile'
          default: null
          nullable: true
        runtime_version:
          type: string
          description: 'Override runtime version of the pipeline being executed.


            Warning: This setting is experimental and may change in the future.

            Requires the platform to run with the unstable feature `runtime_version`

            enabled. Should only be used for testing purposes, and requires

            network access.


            A runtime version can be specified in the form of a version

            or SHA taken from the `feldera/feldera` repository main branch.


            Examples: `v0.96.0` or `f4dcac0989ca0fda7d2eb93602a49d007cb3b0ae`


            A platform of version `0.x.y` may be capable of running future and past

            runtimes with versions `>=0.x.y` and `<=0.x.y` until breaking API changes happen,

            the exact bounds for each platform version are unspecified until we reach a

            stable version. Compatibility is only guaranteed if platform and runtime version

            are exact matches.


            Note that any enterprise features are currently considered to be part of

            the platform.


            If not set (null), the runtime version will be the same as the platform version.'
          default: null
          nullable: true
        use_platform_compiler:
          type: boolean
          description: 'Use the platform SQL compiler when a non-platform `runtime_version` is specified.


            Warning: This setting is experimental and may change in the future.

            Requires the platform to run with the unstable feature `runtime_version` enabled.


            When `false` (default), the SQL compiler matching the `runtime_version` is

            downloaded and used. When `true`, the platform''s SQL compiler is used instead.


            Setting this to `true` avoids downloading the runtime-version-specific SQL

            compiler JAR (e.g., when network access is unavailable or slow), at the cost

            of potentially using a mismatched SQL compiler. The Rust runtime sources are

            still checked out and compiled from the requested `runtime_version`.


            Has no effect when `runtime_version` is not set or the platform does not have

            the unstable feature `runtime_version` enabled.'
          default: false
    DeltaTableWriteMode:
      type: string
      description: 'Delta table write mode.


        Determines how the Delta table connector handles an existing table at the target location.'
      enum:
      - append
      - truncate
      - error_if_exists
    ProgramSchema:
      type: object
      description: 'A struct containing the tables (inputs) and views for a program.


        Parse from the JSON data-type of the DDL generated by the SQL compiler.'
      required:
      - inputs
      - outputs
      properties:
        inputs:
          type: array
          items:
            $ref: '#/components/schemas/Relation'
        outputs:
          type: array
          items:
            $ref: '#/components/schemas/Relation'
    DeliverPolicy:
      oneOf:
      - type: string
        enum:
        - All
      - type: string
        enum:
        - Last
      - type: string
        enum:
        - New
      - type: object
        required:
        - ByStartSequence
        properties:
          ByStartSequence:
            type: object
            required:
            - start_sequence
            properties:
              start_sequence:
                type: integer
                format: int64
                minimum: 0
      - type: object
        required:
        - ByStartTime
        properties:
          ByStartTime:
            type: object
            required:
            - start_time
            properties:
              start_time:
                type: string
                format: date-time
                example: '2023-01-15T09:30:00Z'
      - type: string
        enum:
        - LastPerSubject
    AdHocInputConfig:
      type: object
      description: 'Configuration for inserting data with ad-hoc queries


        An ad-hoc input adapters cannot be usefully configured as part of pipeline

        configuration.  Instead, use ad-hoc queries through the UI, the REST API, or

        the `fda` command-line tool.'
      required:
      - name
      properties:
        name:
          type: string
          description: Autogenerated name.
    PostgresReaderConfig:
      allOf:
      - type: object
        description: TLS/SSL configuration for PostgreSQL connectors.
        properties:
          ssl_ca_location:
            type: string
            description: Path to a file containing a sequence of CA certificates in PEM format.
            nullable: true
          ssl_ca_pem:
            type: string
            description: A sequence of CA certificates in PEM format.
            nullable: true
          ssl_certificate_chain_location:
            type: string
            description: 'The path to the certificate chain file.

              The file must contain a sequence of PEM-formatted certificates,

              the first being the leaf certificate, and the remainder forming

              the chain of certificates up to and including the trusted root certificate.'
            nullable: true
          ssl_client_key:
            type: string
            description: The client certificate key in PEM format.
            nullable: true
          ssl_client_key_location:
            type: string
            description: Path to the client certificate key.
            nullable: true
          ssl_client_location:
            type: string
            description: Path to the client certificate.
            nullable: true
          ssl_client_pem:
            type: string
            description: The client certificate in PEM format.
            nullable: true
          verify_hostname:
            type: boolean
            description: True to enable hostname verification when using TLS. True by default.
            nullable: true
      - type: object
        required:
        - uri
        - query
        properties:
          query:
            type: string
            description: Query that specifies what data to fetch from postgres.
          uri:
            type: string
            description: 'Postgres URI.

              See: <https://docs.rs/tokio-postgres/0.7.12/tokio_postgres/config/struct.Config.html>'
      description: Postgres input connector configuration.
    SqlCompilerMessage:
      type: object
      description: 'A SQL compiler error.


        The SQL compiler returns a list of errors in the following JSON format if

        it''s invoked with the `-je` option.


        ```ignore

        [ {

        "start_line_number" : 2,

        "start_column" : 4,

        "end_line_number" : 2,

        "end_column" : 8,

        "warning" : false,

        "error_type" : "PRIMARY KEY cannot be nullable",

        "message" : "PRIMARY KEY column ''C'' has type INTEGER, which is nullable",

        "snippet" : "    2|   c INT PRIMARY KEY\n         ^^^^^\n    3|);\n"

        } ]

        ```'
      required:
      - start_line_number
      - start_column
      - end_line_number
      - end_column
      - warning
      - error_type
      - message
      properties:
        end_column:
          type: integer
          minimum: 0
        end_line_number:
          type: integer
          minimum: 0
        error_type:
          type: string
        message:
          type: string
        snippet:
          type: string
          nullable: true
        start_column:
          type: integer
          minimum: 0
        start_line_number:
          type: integer
          minimum: 0
        warning:
          type: boolean
    KafkaOutputConfig:
      type: object
      description: Configuration for writing data to a Kafka topic with `OutputTransport`.
      required:
      - topic
      properties:
        fault_tolerance:
          allOf:
          - $ref: '#/components/schemas/KafkaOutputFtConfig'
          nullable: true
        headers:
          type: array
          items:
            $ref: '#/components/schemas/KafkaHeader'
          description: Kafka headers to be added to each message produced by this connector.
        initialization_timeout_secs:
          type: integer
          format: int32
          description: 'Maximum timeout in seconds to wait for the endpoint to connect to

            a Kafka broker.


            Defaults to 60.'
          minimum: 0
        kafka_service:
          type: string
          description: If specified, this service is used to provide defaults for the Kafka options.
          nullable: true
        log_level:
          allOf:
          - $ref: '#/components/schemas/KafkaLogLevel'
          nullable: true
        region:
          type: string
          description: The AWS region to use while connecting to AWS Managed Streaming for Kafka (MSK).
          nullable: true
        topic:
          type: string
          description: Topic to write to.
      additionalProperties:
        type: string
        description: 'Options passed directly to `rdkafka`.


          See [`librdkafka` options](https://github.com/edenhill/librdkafka/blob/master/CONFIGURATION.md)

          used to configure the Kafka producer.'
    ColumnType:
      type: object
      description: 'A SQL column type description.


        Matches the Calcite JSON format.'
      required:
      - nullable
      properties:
        component:
          allOf:
          - $ref: '#/components/schemas/ColumnType'
          nullable: true
        fields:
          type: array
          items:
            $ref: '#/components/schemas/Field'
          description: 'The fields of the type (if available).


            For example this would specify the fields of a `CREATE TYPE` construct.


            ```sql

            CREATE TYPE person_typ AS (

            firstname       VARCHAR(30),

            lastname        VARCHAR(30),

            address         ADDRESS_TYP

            );

            ```


            Would lead to the following `fields` value:


            ```sql

            [

            ColumnType { name: "firstname, ... },

            ColumnType { name: "lastname", ... },

            ColumnType { name: "address", fields: [ ... ] }

            ]

            ```'
          nullable: true
        key:
          allOf:
          - $ref: '#/components/schemas/ColumnType'
          nullable: true
        nullable:
          type: boolean
          description: Does the type accept NULL values?
        precision:
          type: integer
          format: int64
          description: 'Precision of the type.


            # Examples

            - `VARCHAR` sets precision to `-1`.

            - `VARCHAR(255)` sets precision to `255`.

            - `BIGINT`, `DATE`, `FLOAT`, `DOUBLE`, `GEOMETRY`, etc. sets precision

            to None

            - `TIME`, `TIMESTAMP` set precision to `0`.'
          nullable: true
        scale:
          type: integer
          format: int64
          description: 'The scale of the type.


            # Example

            - `DECIMAL(1,2)` sets scale to `2`.'
          nullable: true
        type:
          $ref: '#/components/schemas/SqlType'
        value:
          allOf:
          - $ref: '#/components/schemas/ColumnType'
          nullable: true
    StorageStatusDetails:
      type: object
      description: 'Details about pipeline storage, which are returned as part of the regular runtime status polling

        by the runner.'
      required:
      - checkpoints
      properties:
        checkpoints:
          type: array
          items:
            $ref: '#/components/schemas/CheckpointMetadata'
          description: Present checkpoints.
    MergerType:
      type: string
      description: Which merger to use.
      enum:
      - push_merger
      - list_merger
    IcebergCatalogType:
      type: string
      enum:
      - rest
      - glue
      - s3tables
    FtConfig:
      type: object
      description: 'Fault-tolerance configuration.


        The default [FtConfig] (via [FtConfig::default]) disables fault tolerance,

        which is the configuration that one gets if [RuntimeConfig] omits fault

        tolerance configuration.


        The default value for [FtConfig::model] enables fault tolerance, as

        `Some(FtModel::default())`.  This is the configuration that one gets if

        [RuntimeConfig] includes a fault tolerance configuration but does not

        specify a particular model.'
      properties:
        checkpoint_interval_secs:
          type: integer
          format: int64
          description: 'Interval between automatic checkpoints, in seconds.


            The default is 60 seconds.  Values less than 1 or greater than 3600 will

            be forced into that range.'
          nullable: true
          minimum: 0
        model:
          oneOf:
          - $ref: '#/components/schemas/FtModel'
          - type: string
            enum:
            - none
          default: exactly_once
    DeltaTableWriterConfig:
      type: object
      description: Delta table output connector configuration.
      required:
      - uri
      properties:
        checkpoint_interval:
          type: integer
          format: int32
          description: 'Checkpoint interval (i.e., the number of commits after which a new checkpoint should be created) for newly created Delta tables.


            The option is only available when creating the Delta table (`mode = append` and there

            is no existing table at the target location or `mode = truncate`). It configures the `checkpointInterval`

            table property, which determines the number of commits after which a new checkpoint should be created.


            0 means no checkpoints are created.


            Default: 10.'
          nullable: true
          minimum: 0
        enable_expired_log_cleanup:
          type: boolean
          description: 'Whether to clean up expired log entries when a checkpoint is written.


            Configures the `delta.enableExpiredLogCleanup` table property.  When set to `false`,

            transaction log entries are retained indefinitely regardless of `log_retention_duration`.


            The option is only available when creating the Delta table (`mode = append` and there is

            no existing table at the target location, or `mode = truncate`).


            Default: `true` (Delta Lake default).'
          nullable: true
        log_retention_duration:
          type: string
          description: 'Log retention duration for newly created Delta tables.


            Configures the `delta.logRetentionDuration` table property, which controls how long the

            transaction log history of the table is kept.  Each time a checkpoint is written, Delta Lake

            automatically cleans up log entries older than this interval (subject to

            `enable_expired_log_cleanup`).


            The option is only available when creating the Delta table (`mode = append` and there is

            no existing table at the target location, or `mode = truncate`).


            The value follows the Delta Lake interval syntax: `"interval <N> <unit>"`, where `<unit>`

            is one of `nanosecond[s]`, `microsecond[s]`, `millisecond[s]`, `second[s]`, `minute[s]`,

            `hour[s]`, `day[s]`, or `week[s]`.  Examples: `"interval 30 days"`, `"interval 6 hours"`.


            Default: `"interval 30 days"` (Delta Lake default).'
          nullable: true
        max_retries:
          type: integer
          format: int32
          description: 'Maximum number of retries for failed operations.


            The connector performs retries on several levels: individual S3 operations, Delta Lake transaction commits,

            and overall operation retries. This setting controls the overall operation retries. When a write to the table

            fails, because of an S3 timeout or any other reason that was not resolved by lower-level retries, the connector

            will retry the entire operation.


            When not specified, the connector performs infinite retries. When set to 0, the connector doesn''t

            retry failed operations.'
          nullable: true
          minimum: 0
        mode:
          $ref: '#/components/schemas/DeltaTableWriteMode'
        threads:
          type: integer
          description: 'Number of parallel threads used by the connector.


            Increasing this value can improve Delta Lake write throughput

            by enabling concurrent writes.


            Default: 1.'
          nullable: true
          minimum: 1
        uri:
          type: string
          description: Table URI.
      additionalProperties:
        type: string
        description: 'Storage options for configuring backend object store.


          For specific options available for different storage backends, see:

          * [Azure options](https://docs.rs/object_store/latest/object_store/azure/enum.AzureConfigKey.html)

          * [Amazon S3 options](https://docs.rs/object_store/latest/object_store/aws/enum.AmazonS3ConfigKey.html)

          * [Google Cloud Storage options](https://docs.rs/object_store/latest/object_store/gcp/enum.GoogleConfigKey.html)'
    ConsumerConfig:
      type: object
      required:
      - deliver_policy
      properties:
        deliver_policy:
          $ref: '#/components/schemas/DeliverPolicy'
        description:
          type: string
          nullable: true
        filter_subjects:
          type: array
          items:
            type: string
        max_batch:
          type: integer
          format: int64
          nullable: true
        max_bytes:
          type: integer
          format: int64
          nullable: true
        max_expires:
          type: string
          nullable: true
        max_waiting:
          type: integer
          format: int64
        metadata:
          type: object
          additionalProperties:
            type: string
        name:
          type: string
          nullable: true
        rate_limit:
          type: integer
          format: int64
          minimum: 0
        replay_policy:
          $ref: '#/components/schemas/ReplayPolicy'
    StorageOptions:
      type: object
      description: Storage configuration for a pipeline.
      properties:
        backend:
          allOf:
          - $ref: '#/components/schemas/StorageBackendConfig'
          default:
            name: default
        cache_mib:
          type: integer
          description: 'The maximum size of the in-memory storage cache, in MiB.


            If set, the specified cache size is spread across all the foreground and

            background threads. If unset, each foreground or background thread cache

            is limited to 256 MiB.'
          default: null
          nullable: true
          minimum: 0
        compression:
          allOf:
          - $ref: '#/components/schemas/StorageCompression'
          default: default
        min_step_storage_bytes:
          type: integer
          description: 'For a batch of data passed through the pipeline during a single step,

            the minimum estimated number of bytes to write it to storage.


            This is provided for debugging and fine-tuning and should ordinarily be

            left unset.  A value of 0 will write even empty batches to storage, and

            nonzero values provide a threshold.  `usize::MAX`, the default,

            effectively disables storage for such batches.  If it is set to another

            value, it should ordinarily be greater than or equal to

            `min_storage_bytes`.'
          default: null
          nullable: true
          minimum: 0
        min_storage_bytes:
          type: integer
          description: 'For a batch of data maintained as part of a persistent index during a

            pipeline run, the minimum estimated number of bytes to write it to

            storage.


            This is provided for debugging and fine-tuning and should ordinarily be

            left unset.


            A value of 0 will write even empty batches to storage, and nonzero

            values provide a threshold.  `usize::MAX` would effectively disable

            storage for such batches.  The default is 10,048,576 (10 MiB).'
          default: null
          nullable: true
          minimum: 0
    BufferCacheAllocationStrategy:
      type: string
      description: Controls how caches are shared across a foreground/background worker pair.
      enum:
      - shared_per_worker_pair
      - per_thread
      - global
    PartialProgramInfo:
