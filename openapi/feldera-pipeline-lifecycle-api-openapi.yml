    PostgresWriterConfig:
      allOf:
      - type: object
        description: TLS/SSL configuration for PostgreSQL connectors.
        properties:
          ssl_ca_location:
            type: string
            description: Path to a file containing a sequence of CA certificates in PEM format.
            nullable: true
          ssl_ca_pem:
            type: string
            description: A sequence of CA certificates in PEM format.
            nullable: true
          ssl_certificate_chain_location:
            type: string
            description: 'The path to the certificate chain file.

              The file must contain a sequence of PEM-formatted certificates,

              the first being the leaf certificate, and the remainder forming

              the chain of certificates up to and including the trusted root certificate.'
            nullable: true
          ssl_client_key:
            type: string
            description: The client certificate key in PEM format.
            nullable: true
          ssl_client_key_location:
            type: string
            description: Path to the client certificate key.
            nullable: true
          ssl_client_location:
            type: string
            description: Path to the client certificate.
            nullable: true
          ssl_client_pem:
            type: string
            description: The client certificate in PEM format.
            nullable: true
          verify_hostname:
            type: boolean
            description: True to enable hostname verification when using TLS. True by default.
            nullable: true
      - type: object
        required:
        - uri
        - table
        properties:
          cdc_op_column:
            type: string
            description: 'Name of the operation metadata column in CDC mode.


              Only used when `mode = "cdc"`. This column will contain:

              - `"i"` for insert operations

              - `"u"` for upsert operations

              - `"d"` for delete operations


              Default: `"__feldera_op"`'
            default: __feldera_op
          cdc_ts_column:
            type: string
            description: 'Name of the timestamp metadata column in CDC mode.


              Only used when `mode = "cdc"`. This column will contain the timestamp

              (in RFC 3339 format) when the batch of updates was output

              by the pipeline.


              Default: `"__feldera_ts"`'
            default: __feldera_ts
          extra_columns:
            type: array
            items:
              type: string
            description: 'The names of the extra columns in the Postgres table that are not part of the view schema.


              These connector can write user-defined values, configured using the `set_extra_columns` connector command,

              to these columns.'
          max_buffer_size_bytes:
            type: integer
            description: 'The maximum buffer size in for a single operation.

              Note that the buffers of `INSERT`, `UPDATE` and `DELETE` queries are

              separate.

              Default: 1 MiB'
            default: 1048576
            minimum: 0
          max_records_in_buffer:
            type: integer
            description: The maximum number of records in a single buffer.
            nullable: true
            minimum: 0
          mode:
            allOf:
            - $ref: '#/components/schemas/PostgresWriteMode'
            default: materialized
          on_conflict_do_nothing:
            type: boolean
            description: 'Specifies how the connector handles conflicts when executing an `INSERT`

              into a table with a primary key. By default, an existing row with the same

              key is overwritten. Setting this flag to `true` preserves the existing row

              and ignores the new insert.


              This setting does not affect `UPDATE` statements, which always replace the

              value associated with the key.


              This setting is not supported when `mode = "cdc"`, since all operations

              are performed as append-only `INSERT`s into the target table.

              Any conflict in CDC mode will result in an error.


              Default: `false`'
          table:
            type: string
            description: The table to write the output to.
          threads:
            type: integer
            description: 'The number of threads to use during encoding.


              Default: 1'
            default: 1
            minimum: 0
          uri:
            type: string
            description: 'Postgres URI.

              See: <https://docs.rs/tokio-postgres/0.7.12/tokio_postgres/config/struct.Config.html>'
      description: Postgres output connector configuration.
